name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install tools
        run: |
          nixpkgs_rev=$(awk '$1 == "nixpkgsBootstrapRev:" { print $2 }' .chezmoidata/versions.yaml)
          [[ "$nixpkgs_rev" =~ ^[0-9a-f]{40}$ ]]
          nixpkgs="github:NixOS/nixpkgs/${nixpkgs_rev}"
          packages=(pre-commit treefmt shfmt shellcheck statix nixfmt stylua selene chezmoi prettier typos gitleaks)
          installables=()
          for package in "${packages[@]}"; do
            installables+=("${nixpkgs}#${package}")
          done
          nix profile install "${installables[@]}"
      - name: Setup chezmoi
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          [data]
          hostname = "ci-host"
          platform = "linux"
          work = false
          private = true
          homeWifiSSIDs = ""
          timezone = "UTC"
          gitUsername = "ci"
          gitEmail = "ci@test.com"
          useEncryption = false
          headless = true
          gopassRepository = "https://github.com/test/pass.git"
          keysRepository = "https://github.com/test/keys.git"
          EOF
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  nix:
    name: Nix (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install chezmoi
        run: |
          nixpkgs_rev=$(awk '$1 == "nixpkgsBootstrapRev:" { print $2 }' .chezmoidata/versions.yaml)
          [[ "$nixpkgs_rev" =~ ^[0-9a-f]{40}$ ]]
          nix profile install "github:NixOS/nixpkgs/${nixpkgs_rev}#chezmoi"
      - name: Setup chezmoi
        run: |
          mkdir -p ~/.config/chezmoi
          # shellcheck disable=SC2086 # PLATFORM expands inside the TOML heredoc.
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          [data]
          hostname = "ci-host"
          platform = "$PLATFORM"
          work = false
          private = false
          timezone = "UTC"
          installMasApps = false
          EOF
      - name: Render templates
        run: |
          # Render to temp directory (avoids Git tracking issues with flakes)
          workdir=$(mktemp -d)
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          mkdir -p "$workdir/modules"
          chezmoi execute-template --source . < nix-config/flake.nix.tmpl > "$workdir/flake.nix"
          cp "nix-config/.flake-${PLATFORM}.lock" "$workdir/flake.lock"
          for f in nix-config/modules/*.tmpl; do
            chezmoi execute-template --source . < "$f" > "$workdir/modules/$(basename "${f%.tmpl}")"
          done
          for f in nix-config/modules/*.nix; do
            [ -f "$f" ] && cp "$f" "$workdir/modules/"
          done
      - name: Check flake
        run: nix flake check --no-build "$WORKDIR"
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          flake-lock-path: ${{ env.WORKDIR }}/flake.lock
