repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(tmpl|md)$
      - id: end-of-file-fixer
        exclude: \.tmpl$
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.tmpl$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      #####################################
      # Format: non-template files (auto-fix)
      # Requires: treefmt (with shfmt, nixfmt, stylua, prettier)
      #####################################
      - id: treefmt
        name: Format (treefmt)
        language: system
        pass_filenames: false
        files: \.(sh|nix|lua|md|json|yaml|yml)$
        exclude: \.tmpl$
        entry: treefmt
      #####################################
      # Lint: shell scripts (non-template)
      # Requires: shellcheck
      #####################################
      - id: shellcheck
        name: Shellcheck
        language: system
        types: [shell]
        exclude: (\.tmpl$|\.zsh$)
        entry: shellcheck --severity=warning
      #####################################
      # Lint: Lua files (non-template)
      # Requires: selene
      #####################################
      - id: selene
        name: Selene (Lua)
        language: system
        files: \.lua$
        exclude: (\.tmpl$|Spoons/)
        entry: selene
      #####################################
      # Lint: Nix files (non-template)
      # Requires: statix
      #####################################
      - id: statix
        name: Statix (Nix)
        language: system
        pass_filenames: false
        files: \.nix$
        exclude: \.tmpl$
        entry: statix check nix-config/
      #####################################
      # Lint: source/documentation typos
      # Requires: typos
      #####################################
      - id: typos
        name: Typos
        language: system
        pass_filenames: false
        entry: typos --config typos.toml .
      #####################################
      # Security: staged secret scan
      # Requires: gitleaks
      #####################################
      - id: gitleaks
        name: Gitleaks
        language: system
        pass_filenames: false
        entry: gitleaks git --pre-commit --config .gitleaks.toml --redact --staged --verbose
      #####################################
      # Template: render + format check + lint
      # Requires: chezmoi, treefmt, shellcheck, selene, statix
      #####################################
      - id: check-templates
        name: Validate templates (render + check)
        language: system
        files: \.tmpl$
        exclude: Spoons/
        pass_filenames: false
        entry: bash tests/check_templates.sh
ci:
  autoupdate_schedule: weekly
