[global]
excludes = ["*.tmpl", "flake.lock", ".git/*", "node_modules/*", "**/Spoons/*"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "4"]
includes = ["*.sh"]

[formatter.lua]
command = "stylua"
includes = ["*.lua"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.md", "*.json", "*.yaml", "*.yml"]
# modify_* are chezmoi modify_ scripts (bash), even when their target is .json
# (e.g. ~/.pi/agent/settings.json) — never format them as their target type.
excludes = ["CLAUDE.md", "modify_*"]
