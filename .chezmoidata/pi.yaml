pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Custom Pi theme: Catppuccin Mocha. Loaded from
    # ~/.pi/agent/themes/catppuccin-mocha.json (Pi auto-discovers themes/*.json;
    # hot-reloads on edit). Soft pastel palette (mauve accent, blue functions,
    # green strings, peach numbers); the background-tint tokens
    # (userMessageBg/tool*Bg/selectionBg) are tuned to sit on the ghostty #282a36
    # bg rather than Mocha's own #1e1e2e, so the boxes read naturally on the
    # actual terminal background. The old signalridge-dracula.json is kept in
    # themes/ as a one-`/settings` switch fallback. All footer/TUI semantic
    # colors follow this theme.
    theme: catppuccin-mocha
    # Max reasoning effort by default (off<minimal<low<medium<high<xhigh).
    # Override per-turn in the TUI; subagents still use their own model routing.
    defaultThinkingLevel: xhigh
    # GPT-5.5 via the Krill gateway (https://api.krill-ai.com) is the startup
    # default: key baked into models.json from gopass (claude/krill/private/
    # api_key), so plain `pi` works out of the box — but Krill is silently skipped
    # on a machine WITHOUT that key, so /model switch to newapi/glm-5.2 there.
    # GLM-5.2 (newapi) and DeepSeek V4 also wired (gopass) for /model switching;
    # subagents route independently (see subagents below). Switch at runtime with
    # /model, or e.g. `pi --provider deepseek --model deepseek-v4-pro`.
    defaultProvider: krill
    defaultModel: gpt-5.5
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxRetryDelayMs: 4000
  # ===== Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this settings field when it resolves
  # resources. Keep third-party packages explicit here instead of using a
  # dedicated chezmoi installer script.
  packages:
    - npm:pi-mcp-adapter
    # Information-rich statusline (@narumitw/pi-statusline, most-downloaded). The
    # `classic` preset (env PI_STATUSLINE_PRESET=classic in dot_zshenv) follows the
    # Pi theme (catppuccin-mocha / ghostty Dracula); default tokyo-night is
    # hardcoded blue-gray. Core segment emoji are fixed but render fine in the
    # CaskaydiaCove Nerd Font. Extension-status icons (2nd line) are tunable via
    # ~/.pi/agent/pi-statusline-settings.json extensionStatusIcons ("" removes one).
    - npm:@narumitw/pi-statusline
    # Subagent delegation: child Pi sessions (NOT worktrees) for scout/researcher/
    # planner/worker/reviewer/oracle/context-builder/delegate. Natural-language
    # invoke ("Use reviewer to review this diff"). No slipway conflict.
    - npm:pi-subagents
    # Web search (zero-config Exa, no key) + fetch_content for PDF / GitHub
    # clone / YouTube / local-video. Multi-provider fallback chain. Keys optional
    # in ~/.pi/web-search.json; ffmpeg+yt-dlp (brew) optional for video frames.
    - npm:pi-web-access
    # Permission policy engine: allow/ask/deny gates over tools, bash, path,
    # external_directory, mcp. Policy at dot_pi/agent/extensions/pi-permission-system/
    # config.json. Fails CLOSED — keep JSON strict (no comments/trailing commas).
    - npm:@gotgenes/pi-permission-system
    # readseek: hash-anchored read/edit/grep + structural code maps/search
    # (complements serena's semantic nav with hash-anchored edit safety).
    - npm:pi-readseek
    # hypa: local context runtime — long-context compression, deterministic
    # reducers + evidence record; rewrites shell/read/grep/find/ls and proxies
    # MCP to cut context pollution. Top-downloaded Pi package; pairs with readseek.
    - npm:@hypabolic/pi-hypa
    # retry: widens what counts as retryable (provider "unknown error", Codex
    # ws-limit, and a stall watchdog that aborts a frozen stream after ~90s) and
    # hands off to Pi's built-in retry path. COMPLEMENTS defaults.retry above
    # (that caps backoff; this adds trigger conditions). Zero deps/config.
    - npm:@narumitw/pi-retry
    # caffeinate: inhibits macOS sleep (system `caffeinate`) while the agent is
    # processing a long turn; releases on idle/shutdown. /caffeinate to control.
    # Zero deps. Disable with PI_CAFFEINATE_DISABLED=1.
    - npm:@narumitw/pi-caffeinate
    # goal: `/goal <objective>` autonomous mode — keeps working until goal_complete
    # or a token budget (--tokens) is hit. Pairs well with GLM-5.2's 1M context.
    # Zero deps; state is session-scoped.
    - npm:@narumitw/pi-goal
    # input-history: NOT listed here — it is VENDORED (locally forked/魔改) at
    # dot_pi/agent/extensions/pi-input-history/ and auto-discovered from
    # ~/.pi/agent/extensions/, so no `npm:` entry is needed (listing it too would
    # double-load it and the npm copy would win, shadowing the local edits — see
    # the extension conflict pi reports when both exist). Our fork replaces the
    # single-line reverse-search with a full fzf/atuin-style popup list (Ctrl+R).
    # Ctrl+R is claimed for that popup; Pi's built-in app.session.rename is moved
    # off Ctrl+R to shift+r in dot_pi/agent/keybindings.json to avoid the clash.
    # ultra-compact: smarter auto-compaction than Pi's built-in. Built-in does a
    # single reactive threshold + always-LLM summarize; ultra-compact adds (1) a
    # no-LLM "micro-compaction" tier at 60-90% ctx (strips reasoning + bulk tool
    # output in microseconds, no summary call) and (2) a PREEMPTIVE 70% trigger
    # that fires before the next turn, so long multi-tool turns don't overflow.
    # Coexists with built-in compaction (fallback). PINNED @1.2.1: young, churny,
    # single-maintainer pkg — pinning freezes it and makes `pi update` skip it.
    # Rollback: delete this line, `chezmoi apply`, `pi remove npm:pi-ultra-compact`.
    - npm:pi-ultra-compact@1.2.1
  # ===== Subagents config -> ~/.pi/agent/settings.json subagents =====
  # Model routing for pi-subagents builtins, tiered across the three families so
  # each agent runs on the cheapest model that still clears its bar — and so the
  # reviewer gate runs on a family DIFFERENT from the gpt-5.5 main loop (an
  # independent perspective catches what the main model misses):
  #
  #   gpt-5.5 (krill)   -> oracle. Premium reasoning reserved for the rare, hardest
  #                        one-shot question. NOTE: this now matches the gpt-5.5 main
  #                        loop, so the oracle is a weaker independent second opinion
  #                        than when the main loop ran on GLM — move it to a distinct
  #                        family if independence matters more than raw strength.
  #   deepseek-v4-pro   -> worker, planner, researcher (the defaultModel). Strong,
  #                        economical workhorse for the bulk of the coding/planning/
  #                        investigation volume — too high-throughput for gpt pricing.
  #   glm (newapi)      -> the reviewer plus the cheap mechanical/recon tier, a
  #                        family distinct from the gpt-5.5 main loop: reviewer=
  #                        glm-5.2 (adversarial review — its 1M window and non-gpt
  #                        family make it the strongest independent gate), scout=
  #                        glm-4.7 (quick lookup), context-builder=glm-5.2 (1M window
  #                        suits assembling large context), delegate=glm-4.7 (pure
  #                        dispatch). Runs on the subscription gateway instead of
  #                        burning metered deepseek-flash tokens.
  #
  # deepseek-v4-flash is no longer routed to any subagent (still a /model option).
  #
  # Each override is QUALIFIED as `provider/id`, NOT a bare id. A bare id is
  # resolved by pi-subagents (resolveBaseModelCandidate) via `id ===` across ALL
  # registered models — and pi's BUILT-IN registry also defines `gpt-5.5` (openai /
  # openai-codex, see model-resolver.js). So bare `gpt-5.5` is ambiguous: the match
  # count is >1, the parent provider (newapi) doesn't disambiguate, and it falls
  # through to fuzzy resolution onto a keyless built-in provider → "No API key found
  # for openrouter" (the reviewer/oracle failure). A slash-qualified `krill/gpt-5.5`
  # matches ONLY within the named provider (the resolver's own contract: "a
  # qualified provider/id query only matches within the named provider — never
  # silently switches providers for security/cost-sensitive configs"), so it's
  # collision-proof. glm-*/deepseek-* ids happen to be unique today, but they're
  # qualified too so a future built-in-registry id clash can't resurface this bug.
  #
  # NOTE: modify_settings deep-merges (jq *), so REMOVING an override here does NOT
  # delete it from an existing ~/.pi/agent/settings.json — prune agentOverrides there
  # too when narrowing. (Changing a model VALUE is fine: jq * overwrites scalars.)
  subagents:
    defaultModel: deepseek/deepseek-v4-pro
    agentOverrides:
      oracle: { model: krill/gpt-5.5 }
      reviewer: { model: newapi/glm-5.2 }
      scout: { model: newapi/glm-4.7 }
      context-builder: { model: newapi/glm-5.2 }
      delegate: { model: newapi/glm-4.7 }
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Providers Pi does not know natively, OR built-in providers for which we want
  # to pin specific models Pi's built-in registry lacks (e.g. DeepSeek V4).
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    newapi: # NewAPI multi-provider gateway (https://newapi.3689403.xyz/),
      # OpenAI-compatible; routes to GLM (and anything else the gateway exposes).
      # Startup default (see defaults above). Key from gopass. base_url includes
      # /v1 because Pi's openai-completions api appends /chat/completions (cf.
      # doubao's /api/v3). Models below are a curated subset — extend from the
      # gateway catalogue as needed; pick at runtime with /model.
      base_url: https://newapi.3689403.xyz/v1
      api: openai-completions
      gopass: claude/newapi/private/api_key
      # reasoning: true so Pi's thinking level applies to GLM (footer shows 🧠).
      # compat.supportsDeveloperRole:false is REQUIRED — for reasoning models Pi
      # sends the system prompt as OpenAI's `developer` role, which this gateway
      # rejects with HTTP 422; false makes Pi use `system` instead (root-caused
      # via a logging proxy capturing Pi's request body). thinkingFormat:deepseek
      # because the gateway returns reasoning_content on the assistant message.
      # reasoningEffortMap xhigh→xhigh: gateway accepts high/xhigh/max (all HTTP 200).
      models:
        - id: glm-5.2 # flagship, startup default
          # newapi gateway routes GLM at 200K ctx; set so compaction can compute
          # its threshold (contextWindow - reserveTokens). Without it pi never auto-compacts.
          contextWindow: 1000000
          maxTokens: 131072
          reasoning: true
          # thinkingLevelMap declares which levels GLM supports so Pi does NOT
          # clamp xhigh down to high (agent-session _clampThinkingLevel). Without
          # it the footer shows 🧠 high even when defaultThinkingLevel=xhigh.
          thinkingLevelMap:
            { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh }
          compat:
            supportsDeveloperRole: false
            thinkingFormat: deepseek
            requiresReasoningContentOnAssistantMessages: true
            reasoningEffortMap:
              {
                minimal: low,
                low: low,
                medium: medium,
                high: high,
                xhigh: xhigh,
              }
        - id: glm-4.7 # stable fallback (both verified HTTP 200 on the gateway)
          # newapi gateway routes GLM at 200K ctx; set so compaction can compute
          # its threshold (contextWindow - reserveTokens). Without it pi never auto-compacts.
          contextWindow: 204800
          maxTokens: 131072
          reasoning: true
          thinkingLevelMap:
            { minimal: low, low: low, medium: medium, high: high, xhigh: xhigh }
          compat:
            supportsDeveloperRole: false
            thinkingFormat: deepseek
            requiresReasoningContentOnAssistantMessages: true
            reasoningEffortMap:
              {
                minimal: low,
                low: low,
                medium: medium,
                high: high,
                xhigh: xhigh,
              }
    deepseek: # DeepSeek Platform (OpenAI-compatible). V4 models are not in Pi's
      # built-in registry yet, so we pin them here with the reasoning `compat`
      # block from the official integration doc:
      # https://api-docs.deepseek.com/quick_start/agent_integrations/pi_mono
      base_url: https://api.deepseek.com
      api: openai-completions
      gopass: claude/deepseek/private/api_key
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0 }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
            reasoningEffortMap:
              { minimal: high, low: high, medium: high, high: high, xhigh: max }
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 0.14, output: 0.28, cacheRead: 0.028, cacheWrite: 0 }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
            reasoningEffortMap:
              { minimal: high, low: high, medium: high, high: high, xhigh: max }
    krill: # Krill — gpt-5.5 served on an OpenAI-Responses endpoint
      # (https://api.krill-ai.com). Same upstream Claude Code (anthropic-compatible
      # /codex) and Codex (openai-responses /codex/v1) already use; here we take the
      # Responses route because that's gpt-5.5's native transport, mirroring
      # dot_codex [model_providers.krill] (base_url .../codex/v1, wire_api=responses).
      # Pi's openai-responses api POSTs to <base_url>/responses, so keep the /codex/v1
      # suffix. Key from gopass (claude/krill/private/api_key, the same secret the
      # claude/codex configs read) → baked in at apply time, so
      # `pi --provider krill --model gpt-5.5` works out of the box; the provider is
      # silently skipped on a machine without the key. Pick at runtime with /model.
      base_url: https://api.krill-ai.com/codex/v1
      api: openai-responses
      gopass: claude/krill/private/api_key
      models:
        - id: gpt-5.5
          name: GPT-5.5 (krill)
          # gpt-5 family = 400K total context. Set so Pi's auto-compaction can
          # compute its threshold (contextWindow - reserveTokens); without it Pi
          # never auto-compacts (same reason as the newapi GLM models, #795).
          contextWindow: 400000
          maxTokens: 128000
          reasoning: true
          # openai-responses sends reasoning natively as reasoning:{effort} — no
          # thinkingFormat/compat plumbing needed (that's the openai-completions
          # path used by newapi/deepseek). gpt-5.5 accepts effort up to xhigh
          # (dot_codex sets model_reasoning_effort=xhigh), so map identity and do
          # NOT let Pi clamp xhigh down to high.
          thinkingLevelMap:
            {
              minimal: minimal,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
            }
    qwen: # Alibaba DashScope (OpenAI-compatible)
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: openai-completions
      env: DASHSCOPE_API_KEY
      models:
        - qwen3-coder-plus
        - qwen3-max
    doubao: # ByteDance Ark v3 (OpenAI-compatible)
      base_url: https://ark.cn-beijing.volces.com/api/v3
      api: openai-completions
      env: ARK_API_KEY
      models:
        - doubao-seed-1-6-thinking-250715
