pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Signalridge Ridgeline; the input editor and startup card consume the same
    # Pi theme tokens (no second hard-coded palette). Dracula/Aurora remain in
    # `/settings` for rollback.
    theme: signalridge-ridgeline
    # Silence Pi's own startup header and resource listing so the pi-welcome
    # card (key hints + resource counts) is the whole opening screen.
    # Diagnostics (resource collisions, extension load errors) still show while
    # quiet. Set false to get Pi's own block back above the card.
    quietStartup: true
    # Native openai-codex route: Codex OAuth in ~/.pi/agent/auth.json, no apiKey.
    # The parent model + effort are emitted by dot_pi/agent/modify_settings.json.tmpl
    # (where settings.json is assembled) and equal the `medium` tier. The tier
    # table lives in dot_pi/agent/subagents.json.tmpl, the single source of truth.
    #
    # opencode-go, Kimi Code and the DIRECT DeepSeek platform stay configured, one
    # `/model` switch away. They differ in billing (flat allowance vs per-token)
    # and key (`pi/opencode/api_key` vs `pi/deepseek/api_key`);
    # `deepseek/deepseek-flash` is the native direct-route fallback ID.
    defaultProvider: openai-codex
    # Native compaction: contextTokens > contextWindow - reserveTokens.
    # Reserves are MODEL-SPECIFIC, not a global 130K floor. The 16K baseline
    # keeps a 128K model such as Codex Spark usable (trigger 111,616 instead of
    # -2,000). Known larger windows get explicit budgets below:
    # Terra/Sol/Astra/Luna: measured 921K input window, 320K reserve -> trigger
    # 601K. The reserve is deliberately larger than output headroom: requests near
    # the wall prefill hundreds of thousands of uncached tokens per turn, single
    # responses then hit the backend's 15-minute stream cap ("terminated"), and a
    # compaction from ~790K takes ~10 minutes. Compacting earlier keeps turns fast.
    # Flash/Qwen Coder/Kimi K3: catalog 1M window, 130K reserve -> trigger 870K
    # (these 1M input walls are unprobed). Smaller custom models reserve their
    # output budget plus ~16K for new input/tool data.
    # Pi checks projected context between tool batches and clamps ordinary output
    # to remaining context, so a large catalog output cap alone is not an
    # overflow. Codex requests omit max_output_tokens.
    # A running pi picks up new windows/reserves only after a restart (`pi -c`):
    # /reload misses model metadata, /model misses compaction settings.
    compaction:
      enabled: true
      reserveTokens: 16384
      keepRecentTokens: 16000
      modelOverrides:
        openai-codex/gpt-6.1-terra: { reserveTokens: 320000 }
        openai-codex/gpt-6.1-sol: { reserveTokens: 320000 }
        openai-codex/gpt-6-astra: { reserveTokens: 320000 }
        openai-codex/gpt-5.6-luna: { reserveTokens: 320000 }
        openai-codex/gpt-5.6-sol: { reserveTokens: 130000 }
        openai-codex/gpt-5.6-terra: { reserveTokens: 130000 }
        opencode-go/deepseek-v4-flash: { reserveTokens: 130000 }
        deepseek/deepseek-flash: { reserveTokens: 130000 }
        kimi/k3: { reserveTokens: 130000 }
        kimi/k3-256k: { reserveTokens: 49152 }
        kimi/kimi-for-coding: { reserveTokens: 49152 }
        kimi/kimi-for-coding-highspeed: { reserveTokens: 49152 }
        qwen/qwen3-coder-plus: { reserveTokens: 130000 }
        qwen/qwen3-max: { reserveTokens: 81920 }
        doubao/doubao-seed-1-6-thinking-250715: { reserveTokens: 32768 }
    # Keep /tree branch summarization behavior explicit across Pi upgrades.
    # Reserve 16K tokens for the summary and continue prompting before summarizing.
    branchSummary:
      reserveTokens: 16384
      skipPrompt: false
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Add navigation and extension tools without replacing the native defaults.
    # Plan owns activation of plan_mode_question / plan_mode_complete itself.
    defaultTools:
      - "+grep"
      - "+find"
      - "+ls"
      - "+ask_user_question"
      - "+todo"
      - "+bash_background"
      - "+monitor"
      - "+background_list"
      - "+background_logs"
      - "+background_stop"
      - "+background_clear"
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxAgentDelayMs: 4000
      provider:
        maxRetryDelayMs: 4000
  # ===== External Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this field itself (no chezmoi installer).
  # Third-party infrastructure only; Signalridge packages are listed below and
  # rendered with the `npm:@signalridge/` prefix.
  packages:
    - npm:pi-mcp-adapter
    - npm:pi-web-access
    - npm:@gotgenes/pi-permission-system
    - npm:@hypabolic/pi-hypa
  # Explicit release refresh: change this after a release to reconcile even if
  # this week's package list already succeeded. This is an updater cache key,
  # not a package-version pin or a setting emitted into Pi's settings.json.
  extensionUpdateRevision: "2026-10-18-plan-1.4.5-statusline-1.4.5-tab-1.2.7"
  # ===== Signalridge Pi packages -> ~/.pi/agent/settings.json =====
  # Published packages from github.com/signalridge/pi-extensions, installed from
  # npm by Pi itself. Bare names only: modify_settings.json.tmpl renders each as
  # `npm:@signalridge/<name>` with NO version, so Pi resolves the latest release
  # on first install and run_after_20_update-pi-extensions.sh keeps it current.
  # Never add a `@version` suffix here — pinning is deliberately not done.
  #
  # The checkout at ~/ghq/github.com/signalridge/pi-extensions is a development
  # source only; Pi must not load it, or any legacy ~/.pi/agent/extensions copy,
  # as a second implementation of the same extension.
  #
  # Explicitly opt into stable and experimental extensions below. Loading does
  # not start Goal/Ralph/Plan or grant canonical-history sharing consent.
  # pi-approvals remains excluded: its fail-closed gate blocks hypa_shell and
  # uncertified native mutations. Enable it only as an explicit approval-backend
  # migration with cooperative tool adapters, not a transparent package addition.
  # pi-lsp is optional and omitted; use each project's lint/typecheck commands.
  # Worktree commands remain subject to each repository's own worktree policy;
  # never create or switch worktrees in this dotfiles source checkout.
  # pi-subagents-protocol, pi-ui and pi-approval-core are libraries: install them
  # only as dependencies, never as Pi resources.
  signalridgePackages:
    # Orchestration and human controls
    - pi-subagents
    - pi-workflows
    - pi-goal
    - pi-ralph-wiggum
    - pi-plan-mode
    - pi-ask-user-question
    - pi-todo
    # Processes and workspaces (commands do not run on package load)
    - pi-background
    - pi-worktree
    # Environment bridges
    - pi-gpt-fast
    - pi-agent-guidance
    # Input, chrome, and session UI
    - pi-input-history
    - pi-input-prefix
    - pi-statusline
    - pi-tab-status
    - pi-welcome
    - pi-session-recap
    - pi-sessions
    - pi-recall
    - pi-usage-extension
    - pi-analytics
    - pi-stamp
    - pi-worktime
    # Developer tools
    - pi-github-pr
    - pi-files-widget
    - pi-code-actions
    - pi-btw
    # Compaction remains gated by its own explicit history-sharing consent.
    - pi-codex-compact
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Only providers/models Pi does not ship natively belong here. Built-in model
  # IDs must not be repeated because a custom entry with the same ID replaces
  # Pi's metadata, including its supported thinking levels and pricing tiers.
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    opencode-go: # BUILT-IN provider — this entry ONLY supplies the API key + 1 patch.
      # Per-allowance FALLBACK route: `opencode-go/deepseek-v4-flash`.
      #
      # Pi SHIPS opencode-go natively (pi-ai dist/providers/data/opencode-go.json)
      # and already records the right protocol per model; do NOT re-declare its
      # catalogue. The Go gateway speaks THREE protocols on one host:
      #   openai-completions  https://opencode.ai/zen/go/v1   (most chat models)
      #   openai-responses    https://opencode.ai/zen/go/v1   gpt-5.6-luna, grok-4.5
      #   anthropic-messages  https://opencode.ai/zen/go      minimax-m3,
      #                       qwen3.{7-max,7-plus,8-max}      <- NOTE: no /v1
      #
      # WHY key-only: pi's provider-composer applies `config.baseUrl ?? model.baseUrl`
      # (and likewise `api`) over EVERY built-in model, so a provider-level
      # `base_url`/`api` here would collapse the three protocols (anthropic would
      # hit `/zen/go/v1/v1/messages`), and a `models:` list upserts guesses over
      # better built-in metadata (thinkingLevelMap `max: max`, fuller compat, Go
      # allowance-draw cost). models.dev has no per-model protocol field, so it
      # cannot be the source. An `apiKey`-only config is legal and touches nothing.
      #
      # Docs: https://opencode.ai/docs/zen/  Keys: https://opencode.ai/auth
      # Workspace gates that look like config errors but are not (browser-only
      # opt-ins under https://opencode.ai/workspace/<id>/, no API path):
      #   CreditsError     every model, until the workspace has a payment method
      #   RegionError      deepseek-v4-*, until "models hosted in China" is opted
      #                    in (separate from billing)
      #   403 DataPolicyError  models that retain prompts for training (muse-spark*)
      gopass: pi/opencode/api_key
      # NO `models:` KEY, ON PURPOSE: everything worth reaching is built in, and
      # the gateway ids pi omits are models.dev `status: deprecated`. History
      # (gateway audits, muse-spark-1.2 retirement): git log -S'muse-spark-1.2'.
      #
      # If a model is ever re-added here, `api` and `baseUrl` are MANDATORY: for an
      # id absent from the built-ins, provider-composer falls back to models[0]'s
      # unrelated protocol and resets everything else to hardcoded values
      # (contextWindow 128000, maxTokens 16384, reasoning false, zero cost).
      modelOverrides:
        # Intentional output policy: keep Flash at 128K rather than its native
        # 384K. This is not required by a global compaction reserve floor:
        # compaction budgets are per model, and Pi clamps ordinary output to
        # estimated remaining context. Other Go models retain their catalog caps.
        deepseek-v4-flash: { maxTokens: 128000 }
    openai-codex: # BUILT-IN provider — this entry only PATCHES model metadata.
      # `auth: builtin` emits no apiKey, so the existing Codex OAuth in
      # ~/.pi/agent/auth.json keeps working; `modelOverrides` patches single
      # fields without replacing the provider's model list (a `models:` entry
      # with a matching id would replace the built-in model wholesale — not
      # what we want here).
      #
      # contextWindow is pinned to this OAuth endpoint's MEASURED INPUT ceiling,
      # not the catalog/spec total window: ~921K input is accepted, ~922K fails
      # with "Your input exceeds the context window". 921000 is a conservative
      # accepted-input pin (a synthetic acceptance probe, not a recall benchmark).
      # With reserveTokens 320K it gives a 601K compaction trigger; pinning the
      # larger spec would put the trigger past the wall and collapse headroom.
      # Larger contexts can use more subscription quota; do not treat API price
      # multipliers or Pi's cost estimates as this OAuth account's billing.
      # Verify runtime metadata with `pi --list-models`, not comments alone.
      # Probe history: git log -S'921,065'.
      auth: builtin
      modelOverrides:
        # Startup default and all three tiers (see subagents.json.tmpl).
        # Catalog says 500K; probed 2026-11-08: 919,332 input ACCEPTED,
        # ~925.8K rejected (context_length_exceeded) — same ~922K wall as sol.
        # Retain catalog output/thinking/pricing metadata and builtin auth.
        gpt-6.1-terra: { contextWindow: 921000 }
        # Legacy /model option.
        gpt-6.1-sol: { contextWindow: 921000 }
        # Legacy /model option.
        gpt-5.6-luna: { contextWindow: 921000 }
        # Former high tier and former Codex CLI primary; now a /model option.
        # Dropping this entry is not neutral: astra would fall back to the
        # catalog's 272,000 and the high tier would begin compacting at
        # a negative trigger (272,000 - 320,000) instead of 601,000.
        # COST: astra's unit price is higher than sol's, but it spends far fewer
        # tokens per task and that dominates the bill. Re-measure current rungs
        # (api.codexradar.com intelligence-efficiency) rather than extrapolating
        # from past figures; those are in git log -S'codexradar'.
        gpt-6-astra: { contextWindow: 921000 }
        # Legacy /model options (gpt-5.6-terra below); same accepted-input pin.
        gpt-5.6-sol: { contextWindow: 921000 }
        # THINKING LADDER — pi clamps by itself: getSupportedThinkingLevels treats
        # a `null` value (and, for xhigh/max only, an ABSENT key) as "rung not
        # offered", and clampThinkingLevel walks to the nearest offered rung. Do NOT
        # hand-write full ladders to "fix" maps that look sparse — sparse is the
        # intended encoding.
        # gpt-5.4-mini is the one real defect: models.dev gives it a genuine `max`
        # rung, but its shipped map has no max key, so max clamps DOWN to xhigh and
        # the top rung is unreachable. Its siblings (gpt-5.3-codex-spark, gpt-5.4,
        # gpt-5.5) really stop at xhigh, so their maps are correct as shipped.
        gpt-5.4-mini:
          thinkingLevelMap: { max: max }
        gpt-5.6-terra: { contextWindow: 921000 }
    deepseek: # BUILT-IN provider — this entry ONLY supplies the API key + 1 patch.
      # DeepSeek's own platform (api.deepseek.com), the per-token FALLBACK to the
      # same models the opencode Go subscription above resells. Reach it as
      # `deepseek/deepseek-flash`.
      #
      # Pi's built-in registry carries V4 (pi-ai dist/providers/data/deepseek.json)
      # with its real low|high|max ladder (thinkingLevelMap `max: max`), so there
      # is no `models:` list here: entries upsert over the built-ins and would
      # clobber that metadata. A former hand-pinned list flattened every rung,
      # `max` included, to `high` — silently. History: git log -S'one reasoning mode'.
      gopass: pi/deepseek/api_key
      modelOverrides:
        # Same intentional output policy as the opencode-go copy. The direct-route
        # ID is deepseek-flash; a deepseek-v4-flash key here matches no model and
        # silently leaves the 384K output cap unchanged.
        deepseek-flash: { maxTokens: 128000 }
    kimi: # Kimi Code (Moonshot subscription) — OpenAI-compatible route
      # Pi's built-in `kimi-coding` provider is STALE (k2-era models at 262144,
      # Anthropic protocol) and deliberately left untouched; a separate provider
      # name keeps its metadata intact — per the warning above, reusing a built-in
      # model ID would overwrite its thinking levels and pricing.
      # OpenAI protocol because the Anthropic route (/coding/v1/messages) rejects
      # this key with authentication_error. Same provider name + base_url as the
      # codex `[model_providers.kimi]` block, so the two harnesses agree.
      # Docs: https://www.kimi.com/code/docs/en/kimi-code/models.html
      # Keys: www.kimi.com/code/console (max 5, each shown once at creation).
      base_url: https://api.kimi.com/coding/v1
      api: openai-completions
      # Kimi CODE key (the subscription behind https://api.kimi.com/coding/v1),
      # NOT the Moonshot platform key aichat uses (pi/moonshot/api_key). Two
      # services, two keys; do not collapse them.
      # A missing key is not fatal: private_models.json.tmpl silently SKIPS the
      # provider, so `chezmoi apply` still succeeds and kimi just does not appear
      # in `pi --list-models` until the secret exists.
      gopass: pi/kimi/api_key
      # Subscription/quota billing, not per-token, so cost is zeroed like Pi's
      # own kimi-coding entries — a running total here would be fiction.
      # Effort levels: K3 exposes low / high (its default) / max. K2.7 Code
      # exposes none, so those two models carry no thinkingLevelMap.
      models:
        - id: k3
          name: Kimi K3
          # 1M is an Allegretto-and-above benefit; Moderato caps K3 at 256K. Pi
          # derives its compaction trigger from contextWindow, so on a lower tier
          # this number is a wall waiting to be hit — use k3-256k there, or drop
          # this to 262144. Verify the tier before trusting 1M.
          contextWindow: 1000000
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
          thinkingLevelMap:
            {
              off: none,
              minimal: low,
              low: low,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
            }
        - id: k3-256k
          name: Kimi K3 (256K)
          # Same quality as k3 within 256K at roughly half the quota draw, and
          # unlike k3 its window does not depend on membership tier.
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
          thinkingLevelMap:
            {
              off: none,
              minimal: low,
              low: low,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
            }
        - id: kimi-for-coding
          name: Kimi K2.7 Code
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false
        - id: kimi-for-coding-highspeed
          name: Kimi K2.7 Code HighSpeed
          # ~5-6x faster output at 3x quota draw; Allegretto and above only.
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false
    qwen: # Alibaba DashScope (OpenAI-compatible)
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: openai-completions
      env: DASHSCOPE_API_KEY
      # Keep limits explicit: string-only entries inherit Pi's generic 128K/16K
      # defaults, which are wrong for both hosted Qwen models.
      models:
        - id: qwen3-coder-plus
          contextWindow: 1000000
          maxTokens: 65536
        - id: qwen3-max
          contextWindow: 262144
          maxTokens: 65536
    doubao: # ByteDance Ark v3 (OpenAI-compatible)
      base_url: https://ark.cn-beijing.volces.com/api/v3
      api: openai-completions
      env: ARK_API_KEY
      models:
        - id: doubao-seed-1-6-thinking-250715
          contextWindow: 256000
          maxTokens: 16000
