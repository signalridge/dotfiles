pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Signalridge Ridgeline: a deep, low-noise surface with violet interaction
    # focus, cyan information, and semantic green/amber/red state colors. The
    # rounded input editor and startup card consume these same Pi theme tokens;
    # no extension carries a second hard-coded palette. Dracula and Aurora remain
    # available from `/settings` for rollback.
    theme: signalridge-ridgeline
    # Silence Pi's own startup header and [Section] resource listing so the
    # pi-welcome card is the whole opening screen. Keeping both showed two
    # unrelated designs stacked to roughly forty-five lines. The card carries
    # the pieces worth keeping — the key hints, and counts of context files,
    # skills, prompts, commands and tools derived from Pi's public API — and
    # diagnostics (resource collisions, extension load errors) are still shown
    # while quiet, so nothing actionable is hidden. Set false to get Pi's own
    # block back above the card.
    quietStartup: true
    # User-requested (2026-08-17): ONE model runs everything — the parent session
    # and all three pi-subagents tiers are opencode-go/deepseek-v4-flash at
    # thinking level max. openai-codex keeps its OAuth in ~/.pi/agent/auth.json
    # and stays one `/model` switch away, as do Kimi Code and the DIRECT DeepSeek
    # platform below.
    # The route is the opencode Go SUBSCRIPTION gateway, not DeepSeek's own API.
    # Both carry the same model; they differ in billing (flat allowance vs
    # per-token), in key (`pi/opencode/api_key` vs `pi/deepseek/api_key`), and in
    # advertised effort ladder. The direct provider is kept configured as the
    # fallback — reach it as `deepseek/deepseek-v4-flash`.
    # NOTE `pi/opencode/api_key` DOES NOT EXIST YET. Provision it before
    # `chezmoi apply`, or pi starts pointed at a provider that the template
    # skipped for want of a key.
    defaultProvider: opencode-go
    # The parent model + effort are still emitted from
    # dot_pi/agent/modify_settings.json.tmpl rather than from here, because that is
    # where settings.json is assembled — but they are no longer machine-scoped: both
    # `work` and private resolve to deepseek-v4-flash at max, so the chezmoi `work`
    # ternaries that used to pick between gpt-5.6-luna/xhigh and gpt-5.6-luna/max
    # are gone. Pi remains configured independently from Codex.
    # Trigger threshold = contextWindow - reserveTokens, where contextWindow is
    # the ACTIVE provider/model's. The two candidates differ by more than 2x, and
    # reserveTokens is a single global number, so it has to satisfy BOTH:
    #   opencode-go   deepseek-v4-flash  1M     (the startup default -> what applies)
    #   openai-codex  gpt-5.6-luna       372K   (the /model fallback)
    # A reserve sized for flash's real 384K output cap (>= 384000) would make
    # `372000 - reserveTokens` NEGATIVE and put every codex turn permanently over
    # the threshold. That is why BOTH deepseek-v4-flash entries below (the
    # opencode-go one and the direct one) pin maxTokens to 128000 instead of the
    # model's true 384000 — see the comments there. Other opencode-go models keep
    # their real output caps, so a /model switch can re-enter this landmine.
    #
    # SIZING (measured 2026-08-09, not theoretical). Pi evaluates the threshold
    # at only two points — after an agent run ends and before the next prompt
    # (the two `_checkCompaction` call sites in core/agent-session.js) — and
    # NEVER between tool calls. reserveTokens is therefore not just a trigger
    # offset: it is the UNCHECKED HEADROOM that one entire tool loop plus its
    # final response has to fit inside. Size it against a loop, not a turn.
    # Evidence under the previous 40K reserve (trigger 332K):
    #   - session 2026-08-08T15-57 (~/.pi/agent/sessions): 76 of 88 assistant
    #     messages stopped on `toolUse`, i.e. unchecked; compaction actually
    #     fired at tokensBefore=360452 — 28K past the trigger, 11K from the wall.
    #   - other sessions lost the race outright: consecutive toolUse messages
    #     climbing 360731 -> 370478, then "Your input exceeds the context window
    #     of this model" (>=0.84.0 then compact-and-retries, at the cost of a
    #     wasted request); one truncated at `length` with tot=371566.
    # maxTokens is 128K for BOTH candidates — natively on codex, and by the
    # deliberate pin in the deepseek block below — so reserve >= 128K is the
    # correctness floor: a single maximal response must not be able to cross the
    # wall on its own. 130K clears that floor and leaves 130K of unchecked
    # headroom instead of 40K. This lowers the probability of hitting the wall;
    # it cannot eliminate it, because no threshold can bound growth that is never
    # measured. Where 130K lands, per active model:
    #   opencode-go/deepseek-v4-flash  1M   -> trigger 870K (87%)
    #   openai-codex/gpt-5.6-luna      372K -> trigger 242K (65%)
    # Accepted costs: on the codex fallback, usable working context 332K -> 242K
    # and compaction runs more often (more lossy summaries, more prompt-cache
    # invalidation). Note reserveTokens is double-duty — the summary's own output
    # budget is min(0.8*reserveTokens, maxTokens) = 104K here (core/compaction/
    # compaction.js), a cap rather than a target.
    # Bonus, codex fallback only: 242K sits BELOW the 272K premium-pricing line,
    # so the tail of a long session no longer bills at 2x input / 1.5x output.
    # DeepSeek has no equivalent pricing cliff — it bills one flat per-token rate
    # (discounted off-peak) with no context-length tier — so the 870K trigger on
    # the default model is a context-safety number only.
    #
    # This is now the ONLY compaction trigger. The locally authored
    # pi-early-compaction extension was deleted on 2026-08-08: it re-checked the
    # same `contextWindow - reserveTokens` inequality at every tool-use turn_end
    # with a hardcoded reserve of 96000 — identical to the native value — and
    # drove it through `ctx.compact()`, whose first act is `await this.abort()`.
    # That abort ends the agent run, so pi's own post-run `_checkCompaction`
    # fired on the same crossing and raced the extension's still-in-flight
    # manual compaction. Both prepared from the same state (identical
    # `Compacted from N tokens` lines); the loser threw `Already compacted`.
    # Same trap that removed pi-continue. Do NOT reintroduce a second trigger
    # sharing this threshold. A LOWER threshold would dodge that particular race
    # (the native check would see a sub-threshold context and return false), but
    # it is still not a fix: `ctx.compact()` opens with `await this.abort()`,
    # which ends the agent run — so any extension-driven mid-loop compaction
    # severs the tool loop it was meant to protect. Sizing reserveTokens is the
    # only clean lever pi exposes; there is no interval/percentage knob
    # (getCompactionSettings reads exactly enabled/reserveTokens/
    # keepRecentTokens).
    compaction:
      enabled: true
      reserveTokens: 130000
      keepRecentTokens: 16000
    # Keep /tree branch summarization behavior explicit across Pi upgrades.
    # Reserve 16K tokens for the summary and continue prompting before summarizing.
    branchSummary:
      reserveTokens: 16384
      skipPrompt: false
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxRetryDelayMs: 4000
  # ===== Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this settings field when it resolves
  # resources. Keep third-party packages explicit here instead of using a
  # dedicated chezmoi installer script.
  # ===== External Pi packages -> ~/.pi/agent/settings.json =====
  # Infrastructure owned by the runtime environment rather than by
  # signalridge/pi-extensions. Signalridge packages are listed separately below
  # and rendered with the `npm:@signalridge/` prefix.
  packages:
    - npm:pi-mcp-adapter
    - npm:pi-web-access
    - npm:@gotgenes/pi-permission-system
    - npm:pi-readseek
    - npm:@hypabolic/pi-hypa
  # ===== Signalridge Pi packages -> ~/.pi/agent/settings.json =====
  # Published packages from github.com/signalridge/pi-extensions, installed from
  # npm by Pi itself. Bare names only: modify_settings.json.tmpl renders each as
  # `npm:@signalridge/<name>` with NO version, so Pi resolves the latest release
  # on first install and run_after_20_update-pi-extensions.sh keeps it current.
  # Never add a `@version` suffix here — pinning is deliberately not done.
  #
  # The checkout at ~/ghq/github.com/signalridge/pi-extensions is a development
  # source only; Pi must not load it, or any legacy ~/.pi/agent/extensions copy,
  # as a second implementation of the same extension.
  #
  # Excluded on purpose:
  #   pi-worktree   — repository constitution forbids worktrees (CLAUDE.md Art. 1)
  #   pi-worktime   — publishable but opt-in; not yet released to npm
  #   pi-recall, pi-codex-compact, pi-analytics — experimental, opt-in
  #   pi-subagents-protocol — pure library, a dependency and never a Pi resource
  signalridgePackages:
    # Orchestration
    - pi-subagents
    - pi-workflows
    - pi-goal
    - pi-ralph-wiggum
    - pi-plan-mode
    # Environment bridges
    - pi-herdr-state
    - pi-gpt-fast
    - pi-agent-guidance
    # Input, chrome, and session UI
    - pi-input-history
    - pi-input-prefix
    - pi-statusline
    - pi-tab-status
    - pi-welcome
    - pi-session-recap
    - pi-usage-extension
    - pi-stamp
    # Developer tools
    - pi-lsp
    - pi-github-pr
    - pi-files-widget
    - pi-code-actions
    - pi-btw
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Only providers/models Pi does not ship natively belong here. Built-in model
  # IDs must not be repeated because a custom entry with the same ID replaces
  # Pi's metadata, including its supported thinking levels and pricing tiers.
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    opencode-go: # opencode Go subscription gateway — THE STARTUP DEFAULT.
      # A flat-rate subscription ($5 first month, then $10/mo) in front of a pool
      # of open-weight coding models, billed against a dollar-denominated
      # allowance rather than per-token invoices: $60/month, $30/week, $12 per
      # rolling 5 hours. Exceeding a window throttles that window, so the `cost`
      # figures below are an allowance-draw estimate, not a bill — which is why
      # they are kept real here instead of zeroed the way the Kimi subscription
      # entries are. DeepSeek rows are off-peak rates; peak (01:00-04:00 and
      # 06:00-10:00 UTC) doubles input and output.
      #
      # THE WHOLE MODEL LIST IS GENERATED, not hand-written, from the registry
      # opencode itself publishes: https://models.dev/api.json -> "opencode-go".
      # id/name/contextWindow/maxTokens/reasoning/cost come straight from that
      # entry, so re-derive rather than hand-patch when the catalogue moves.
      # Provider shape comes from the same place: api https://opencode.ai/zen/go/v1,
      # npm @ai-sdk/openai-compatible (hence api: openai-completions).
      # Docs: https://opencode.ai/docs/zen/  Keys: https://opencode.ai/auth
      #
      # 25 models. The live endpoint (GET /zen/go/v1/models, UNauthenticated —
      # a successful listing proves nothing about your key) advertises 26; the
      # extra one is `hy3-preview`, which models.dev carries no metadata for and
      # which is therefore deliberately omitted rather than guessed at.
      #
      # thinkingLevelMap is emitted ONLY for models whose models.dev entry has a
      # `reasoning_options` effort ladder, and is mapped onto that model's real
      # rungs — the ladders genuinely differ (low|high|max, high|max, max-only,
      # low|medium|high, none|low|high, and gpt-5.6-luna's full six). A model
      # with no ladder gets no map, so pi sends no reasoning_effort for it.
      # Getting this wrong is silent: see the direct-DeepSeek block below, whose
      # map used to flatten `max` to `high`.
      #
      # compat: emitted for every model whose models.dev entry reports
      # `interleaved.field: reasoning_content`. UNVERIFIED against live traffic —
      # the opencode key that existed when this was written returned 401 on POST
      # /chat/completions, and `pi/opencode/api_key` has not been provisioned
      # since. If a family's reasoning comes back malformed, drop its `compat`
      # first: a normalising gateway may already speak plain OpenAI. Note this
      # deliberately diverges from the direct `kimi` provider below, which sets
      # `supportsDeveloperRole: false` instead — different route, different wire.
      #
      # CONTEXT WARNING: reserveTokens is 130000 globally, so the 200K-class
      # models here (glm-5, glm-5.1, minimax-m2.5, minimax-m2.7) leave only about
      # 73K of usable context before compaction fires. Nothing goes negative —
      # the smallest window is 202752 — but they are not comfortable choices for
      # long sessions.
      base_url: https://opencode.ai/zen/go/v1
      api: openai-completions
      # Does NOT exist yet — this provider is skipped by private_models.json.tmpl
      # until the key is inserted, and since it is defaultProvider, pi would
      # otherwise start pointed at a provider absent from models.json. Provision
      # with `gopass insert pi/opencode/api_key` BEFORE `chezmoi apply`.
      # Auth is `Authorization: Bearer <key>`; the gateway answers a bare
      # x-api-key with "Missing API key."
      gopass: pi/opencode/api_key
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          # THE STARTUP DEFAULT, and the one model here whose maxTokens is not
          # models.dev's value. Real cap is 384000; pinned to 128000 because
          # compaction.reserveTokens is ONE global number with a
          # `reserveTokens >= maxTokens` floor (see the SIZING block above).
          # Honouring 384000 would force reserveTokens past 384000, driving
          # `372000 - reserveTokens` negative and making the openai-codex
          # fallback compact on every turn. 128K is ~4x a normal agentic
          # response. Every other model below keeps its true output cap; if you
          # /model onto one with a bigger cap you re-enter that landmine.
          maxTokens: 128000
          reasoning: true
          cost: { input: 0.22, output: 0.66, cacheRead: 0.007, cacheWrite: 0 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
            }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro (New)
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 0.66, output: 1.98, cacheRead: 0.022, cacheWrite: 0 }
          thinkingLevelMap:
            {
              minimal: high,
              low: high,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
