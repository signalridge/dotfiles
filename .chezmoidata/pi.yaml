pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Custom Pi theme: Catppuccin Mocha. Loaded from
    # ~/.pi/agent/themes/catppuccin-mocha.json (Pi auto-discovers themes/*.json;
    # hot-reloads on edit). Soft pastel palette (mauve accent, blue functions,
    # green strings, peach numbers); the background-tint tokens
    # (userMessageBg/tool*Bg/selectionBg) are tuned to sit on the ghostty #282a36
    # bg rather than Mocha's own #1e1e2e, so the boxes read naturally on the
    # actual terminal background. The old signalridge-dracula.json is kept in
    # themes/ as a one-`/settings` switch fallback. All footer/TUI semantic
    # colors follow this theme.
    theme: catppuccin-mocha
    # Pi 0.80.6+ exposes GPT-5.6's native `max` reasoning effort above `xhigh`.
    # `ultra` is not a reasoning-effort value: OpenAI describes it as a
    # multi-agent orchestration mode, so Pi/Responses API requests must use `max`.
    defaultThinkingLevel: max
    # GPT-5.6 Sol via Pi's built-in OpenAI Codex OAuth provider. No custom model
    # compatibility entry is needed; authenticate once with `/login openai-codex`.
    # Krill (gopass GPT-5.6), GLM-5.2 (newapi), and DeepSeek V4 remain /model
    # alternatives; subagents route independently below.
    defaultProvider: openai-codex
    defaultModel: gpt-5.6-sol
    # Use Pi's native compaction and trigger well before the model window is full.
    # Threshold = contextWindow - reserveTokens: ~82% for both OpenAI Codex 372K
    # and Krill 371K. The larger headroom covers long 20-30K tool turns; keeping
    # only 16K recent tokens ensures the context drops materially.
    compaction:
      enabled: true
      reserveTokens: 65536
      keepRecentTokens: 16000
    # Keep /tree branch summarization behavior explicit across Pi upgrades.
    # Reserve 16K tokens for the summary and continue prompting before summarizing.
    branchSummary:
      reserveTokens: 16384
      skipPrompt: false
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxRetryDelayMs: 4000
  # ===== Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this settings field when it resolves
  # resources. Keep third-party packages explicit here instead of using a
  # dedicated chezmoi installer script.
  packages:
    - npm:pi-mcp-adapter
    # Statusline is VENDORED (fork of @narumitw/pi-statusline) at
    # dot_pi/agent/extensions/pi-statusline so we can trim it — do NOT re-add the
    # `npm:@narumitw/pi-statusline` entry here: it double-loads with the vendored
    # copy and the npm copy wins, making local edits dead (same trap as
    # pi-input-history). The fork keeps all upstream segments EXCEPT the π brand
    # (model/thinking/dir/branch/tools/context/tokens/cost/time) but strips the
    # decorative per-segment emoji — short text labels + only ⎇ branch / $ cost. Active
    # `classic` preset (env PI_STATUSLINE_PRESET=classic in dot_zshenv) follows the
    # Pi theme. Extension-status icons (2nd line) are tunable via
    # ~/.pi/agent/pi-statusline-settings.json extensionStatusIcons ("" removes one).
    # Subagent delegation: child Pi sessions (NOT worktrees) for scout/researcher/
    # planner/worker/reviewer/oracle/context-builder/delegate. Natural-language
    # invoke ("Use reviewer to review this diff"). No slipway conflict.
    - npm:pi-subagents
    # Web search (zero-config Exa, no key) + fetch_content for PDF / GitHub
    # clone / YouTube / local-video. Multi-provider fallback chain. Keys optional
    # in ~/.pi/web-search.json; ffmpeg+yt-dlp (brew) optional for video frames.
    - npm:pi-web-access
    # Permission policy engine: allow/ask/deny gates over tools, bash, path,
    # external_directory, mcp. Policy at dot_pi/agent/extensions/pi-permission-system/
    # config.json. Fails CLOSED — keep JSON strict (no comments/trailing commas).
    - npm:@gotgenes/pi-permission-system
    # readseek: hash-anchored read/edit/grep + structural code maps/search
    # (complements serena's semantic nav with hash-anchored edit safety).
    - npm:pi-readseek
    # hypa: local context runtime — long-context compression, deterministic
    # reducers + evidence record; rewrites shell/read/grep/find/ls and proxies
    # MCP to cut context pollution. Top-downloaded Pi package; pairs with readseek.
    - npm:@hypabolic/pi-hypa
    # retry: widens what counts as retryable (provider "unknown error", Codex
    # ws-limit, and a stall watchdog that aborts a frozen stream after ~90s) and
    # hands off to Pi's built-in retry path. COMPLEMENTS defaults.retry above
    # (that caps backoff; this adds trigger conditions). Zero deps/config.
    - npm:@narumitw/pi-retry
    # caffeinate: inhibits macOS sleep (system `caffeinate`) while the agent is
    # processing a long turn; releases on idle/shutdown. /caffeinate to control.
    # Zero deps. Disable with PI_CAFFEINATE_DISABLED=1.
    - npm:@narumitw/pi-caffeinate
    # goal: `/goal <objective>` autonomous mode — keeps working until goal_complete
    # or a token budget (--tokens) is hit. Pairs well with long-context models;
    # switch to GLM-5.2 when a 1M window matters more than the GPT default.
    # Zero deps; state is session-scoped.
    - npm:@narumitw/pi-goal
    # input-history: NOT listed here — it is VENDORED (locally forked/魔改) at
    # dot_pi/agent/extensions/pi-input-history/ and auto-discovered from
    # ~/.pi/agent/extensions/, so no `npm:` entry is needed (listing it too would
    # double-load it and the npm copy would win, shadowing the local edits — see
    # the extension conflict pi reports when both exist). Our fork replaces the
    # single-line reverse-search with a full fzf/atuin-style popup list (Ctrl+R).
    # Ctrl+R is claimed for that popup; Pi's built-in app.session.rename is moved
    # off Ctrl+R to shift+r in dot_pi/agent/keybindings.json to avoid the clash.
  # ===== Subagents config -> ~/.pi/agent/settings.json subagents =====
  # Model routing for pi-subagents builtins, tiered across families so the
  # reviewer gate can stay independent from the non-adversarial context route:
  #
  #   gpt-5.6-sol (openai-codex) -> defaultModel plus worker, planner,
  #                        researcher, reviewer, and oracle. Pi 0.80.6+ ships
  #                        native Sol/Terra/Luna metadata, including `max`.
  #                        pi-subagents 0.34.0 only recognizes levels through
  #                        xhigh and otherwise emits an invalid `:max:max`, so
  #                        child agents remain xhigh until that package adds max.
  #   glm (newapi)      -> context-builder=glm-5.2 (1M window suits assembling large
  #                        context), on the subscription gateway. Same family as the
  #                        main loop; fine for non-adversarial context assembly.
  #   deepseek (flash)  -> scout + delegate = deepseek-v4-flash (quick recon lookup /
  #                        pure dispatch). Moved OFF newapi/glm-4.7, which was hitting
  #                        gateway HTTP 429 under their high-frequency dispatch;
  #                        DeepSeek Platform is a separate metered endpoint (cheap:
  #                        $0.14/$0.28 per Mtok), so they no longer contend with the
  #                        subscription gateway.
  #
  # deepseek-v4-pro and krill/gpt-5.x are retained as /model fallbacks but are not
  # routed to subagents by default.
  #
  # AUTH: GPT routes use OpenAI Codex OAuth (`/login openai-codex`);
  # deepseek/glm still use gopass-backed providers. No Krill key is needed for the
  # default subagent routes.
  #
  # Each override is QUALIFIED as `provider/id`, NOT a bare id. A bare id is
  # resolved by pi-subagents (resolveBaseModelCandidate) via `id ===` across ALL
  # registered models — and pi's registry can define the same bare GPT ids under
  # openai/openai-codex/openrouter/custom providers. So bare GPT ids are ambiguous:
  # the match count can be >1, the parent provider doesn't disambiguate, and it can
  # fall through to a keyless provider. A slash-qualified
  # `openai-codex/gpt-5.6-sol` matches only within the official OpenAI Codex
  # provider, so it is collision-proof.
  #
  # NOTE: modify_settings deep-merges (jq *), so REMOVING an override here does NOT
  # delete it from an existing ~/.pi/agent/settings.json — prune agentOverrides there
  # too when narrowing. (Changing a model VALUE is fine: jq * overwrites scalars.)
  subagents:
    defaultModel: openai-codex/gpt-5.6-sol
    # toolBudget: raise the per-child tool-call ceiling so heavy agents (esp. the
    # reviewer gate on large diffs) don't get the "Tool budget soft limit reached
    # after N tool calls ... finalize" nudge and wrap up prematurely. Builtin
    # defaults are ~30 soft / ~50 hard. `hard` is required; `soft` nudges first;
    # `block` (omitted) defaults to blocking read/grep/find/ls after `hard` so the
    # child can still finalize. NOTE: this is the only budget knob agentOverrides
    # accepts — run timeout (timeoutMs) and turnBudget are per-call args, not
    # settings-configurable here.
    agentOverrides:
      worker: { thinking: xhigh, toolBudget: { soft: 150, hard: 220 } }
      planner: { thinking: xhigh, toolBudget: { soft: 100, hard: 150 } }
      researcher: { thinking: xhigh, toolBudget: { soft: 100, hard: 150 } }
      reviewer:
        {
          model: openai-codex/gpt-5.6-sol,
          thinking: xhigh,
          toolBudget: { soft: 160, hard: 240 },
        }
      oracle:
        {
          model: openai-codex/gpt-5.6-sol,
          thinking: xhigh,
          toolBudget: { soft: 120, hard: 180 },
        }
      scout:
        {
          model: deepseek/deepseek-v4-flash,
          thinking: xhigh,
          toolBudget: { soft: 80, hard: 120 },
        }
      context-builder:
        {
          model: newapi/glm-5.2,
          thinking: xhigh,
          toolBudget: { soft: 80, hard: 120 },
        }
      delegate:
        {
          model: deepseek/deepseek-v4-flash,
          thinking: xhigh,
          toolBudget: { soft: 80, hard: 120 },
        }
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Only providers/models Pi does not ship natively belong here. Built-in model
  # IDs must not be repeated because a custom entry with the same ID replaces
  # Pi's metadata, including its supported thinking levels and pricing tiers.
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    newapi: # NewAPI multi-provider gateway (https://newapi.3689403.xyz/),
      # OpenAI-compatible; routes to GLM (and anything else the gateway exposes).
      # Long-context /model option and context-builder route. Key from gopass.
      # base_url includes
      # /v1 because Pi's openai-completions api appends /chat/completions (cf.
      # doubao's /api/v3). Models below are a curated subset — extend from the
      # gateway catalogue as needed; pick at runtime with /model.
      base_url: https://newapi.3689403.xyz/v1
      api: openai-completions
      gopass: claude/newapi/private/api_key
      # reasoning: true so Pi's thinking level applies to GLM (footer shows 🧠).
      # compat.supportsDeveloperRole:false is REQUIRED — for reasoning models Pi
      # sends the system prompt as OpenAI's `developer` role, which this gateway
      # rejects with HTTP 422; false makes Pi use `system` instead (root-caused
      # via a logging proxy capturing Pi's request body). thinkingFormat:deepseek
      # because the gateway returns reasoning_content on the assistant message.
      # thinkingLevelMap exposes the gateway's verified low..max effort values.
      models:
        - id: glm-5.2 # flagship long-context option
          # newapi gateway routes GLM-5.2 at its native 1M ctx; set so compaction
          # can compute its threshold (contextWindow - reserveTokens). Without it
          # pi never auto-compacts. (footer ctx% = usedTokens / this value.)
          contextWindow: 1000000
          maxTokens: 131072
          reasoning: true
          # Expose the full verified ladder through max so Pi does not clamp the
          # configured level to high in interactive or subagent sessions.
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
          compat:
            supportsDeveloperRole: false
            thinkingFormat: deepseek
            requiresReasoningContentOnAssistantMessages: true
        - id: glm-4.7 # stable fallback (both verified HTTP 200 on the gateway)
          # newapi gateway routes GLM at 200K ctx; set so compaction can compute
          # its threshold (contextWindow - reserveTokens). Without it pi never auto-compacts.
          contextWindow: 204800
          maxTokens: 131072
          reasoning: true
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
          compat:
            supportsDeveloperRole: false
            thinkingFormat: deepseek
            requiresReasoningContentOnAssistantMessages: true
    deepseek: # DeepSeek Platform (OpenAI-compatible). V4 models are not in Pi's
      # built-in registry yet, so we pin them here with the reasoning `compat`
      # block from the official integration doc:
      # https://api-docs.deepseek.com/quick_start/agent_integrations/pi_mono
      base_url: https://api.deepseek.com
      api: openai-completions
      gopass: claude/deepseek/private/api_key
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0 }
          # DeepSeek V4 currently exposes one reasoning mode; preserve the old
          # intent by mapping every Pi level through xhigh to provider `high`.
          thinkingLevelMap:
            { minimal: high, low: high, medium: high, high: high, xhigh: high }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 0.14, output: 0.28, cacheRead: 0.028, cacheWrite: 0 }
          thinkingLevelMap:
            { minimal: high, low: high, medium: high, high: high, xhigh: high }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
    krill: # Krill — GPT-5.x served on an OpenAI-Responses endpoint
      # (https://api.krill-ai.com). Same upstream Claude Code (anthropic-compatible
      # /codex) and Codex (openai-responses /codex/v1) already use; here we take the
      # Responses route because that's the GPT-5.x native transport, mirroring
      # dot_codex [model_providers.krill] (base_url .../codex/v1, wire_api=responses).
      # Pi's openai-responses api POSTs to <base_url>/responses, so keep the /codex/v1
      # suffix. Key from gopass (claude/krill/private/api_key, the same secret the
      # claude/codex configs read) → baked in at apply time, so
      # `pi --provider krill --model gpt-5.6-sol` works out of the box; the provider is
      # silently skipped on a machine without the key. Pick at runtime with /model.
      base_url: https://api.krill-ai.com/codex/v1
      api: openai-responses
      gopass: claude/krill/private/api_key
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol (krill)
          # Krill live-check: /responses accepts Sol/Terra/Luna but not the bare
          # gpt-5.6 alias. The gateway is conservatively capped at 371K context.
          # GPT-5.6 rejects minimal, so map it to low; expose native xhigh and max.
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 6.25 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra (krill)
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 3.125 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna (krill)
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 1, output: 6, cacheRead: 0.1, cacheWrite: 1.25 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.5
          name: GPT-5.5 (krill)
          # Gateway-specific fallback retained at its existing explicit limit;
          # do not substitute OpenAI/Codex limits without a Krill boundary probe.
          contextWindow: 400000
          maxTokens: 128000
          reasoning: true
          # gpt-5.5 accepts effort up to xhigh, so map identity and do NOT let Pi
          # clamp xhigh down to high.
          thinkingLevelMap:
            {
              minimal: minimal,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
            }
    qwen: # Alibaba DashScope (OpenAI-compatible)
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: openai-completions
      env: DASHSCOPE_API_KEY
      # Keep limits explicit: string-only entries inherit Pi's generic 128K/16K
      # defaults, which are wrong for both hosted Qwen models.
      models:
        - id: qwen3-coder-plus
          contextWindow: 1000000
          maxTokens: 65536
        - id: qwen3-max
          contextWindow: 262144
          maxTokens: 65536
    doubao: # ByteDance Ark v3 (OpenAI-compatible)
      base_url: https://ark.cn-beijing.volces.com/api/v3
      api: openai-completions
      env: ARK_API_KEY
      models:
        - id: doubao-seed-1-6-thinking-250715
          contextWindow: 256000
          maxTokens: 16000
