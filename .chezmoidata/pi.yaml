pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Saturated Dracula theme aligned with the terminal palette. Purple is
    # the primary interaction color (matching Herdr's active border); cyan stays
    # available for links and syntax while green/orange/red communicate state.
    # The rounded input editor follows these Pi theme colors instead of carrying
    # an independent Kimi Code palette. Catppuccin Mocha remains available from
    # `/settings`.
    theme: signalridge-dracula
    # Silences BOTH of pi's startup blocks — the three-line header and, via the
    # same flag, showLoadedResources():
    #   const showListing = force || verbose || !getQuietStartup()
    # That is deliberate. pi renders those into containers that always sort
    # above the transcript (documentContainer: header -> loadedResources ->
    # chat), so while they exist the Kimi-style card — a custom entry, hence
    # part of the transcript — can only ever appear BELOW them. Silencing them
    # is the only way to put the card first.
    # Nothing is lost: dot_pi/agent/extensions/pi-welcome.ts rebuilds the
    # [Context]/[Skills]/[Prompts]/[Themes]/[Extensions] listing inside the card
    # from pi's OWN DefaultResourceLoader, so it is the same data pi would have
    # printed, not a second opinion. Run `pi --verbose` to see pi's version and
    # compare if you ever suspect drift.
    quietStartup: true
    # User-requested switch back to the native OpenAI Codex OAuth provider
    # (openai-codex; OAuth in ~/.pi/agent/auth.json). openai-codex is now the ONLY
    # provider anything defaults to: the parent runs the model chosen below and
    # every subagent runs gpt-5.6-luna (see the pi-subagents note below). The
    # gopass-backed Krill gateway stays defined under customProviders as a manual
    # /model fallback, and deepseek/qwen/doubao remain available the same way.
    defaultProvider: openai-codex
    # The parent model + effort are MACHINE-SCOPED and shared with Codex — both
    # live in .chezmoidata/models.yaml (`agentModels`), resolved against
    # chezmoi's `work` flag in dot_pi/agent/modify_settings.json.tmpl. They are
    # deliberately NOT duplicated here; see that file for why the branch cannot
    # live in the data itself. Whichever applies, the model is 372K/128K on
    # openai-codex, so the reserveTokens maths below is unaffected.
    # Trigger threshold = contextWindow - reserveTokens, where contextWindow is
    # the ACTIVE provider/model's. Verify with `pi --list-models <id>` before
    # touching this number — the two gpt-5.6-sol entries differ, and the Codex
    # one is only 372K because of the modelOverrides block under
    # customProviders below (its server catalog says 272K):
    #   krill         gpt-5.6-sol  371K   (manual /model fallback, capped below)
    #   openai-codex  gpt-5.6-sol  372K   (the startup default -> what applies)
    #
    # SIZING (measured 2026-08-09, not theoretical). Pi evaluates the threshold
    # at only two points — after an agent run ends and before the next prompt
    # (the two `_checkCompaction` call sites in core/agent-session.js) — and
    # NEVER between tool calls. reserveTokens is therefore not just a trigger
    # offset: it is the UNCHECKED HEADROOM that one entire tool loop plus its
    # final response has to fit inside. Size it against a loop, not a turn.
    # Evidence under the previous 40K reserve (trigger 332K):
    #   - session 2026-08-08T15-57 (~/.pi/agent/sessions): 76 of 88 assistant
    #     messages stopped on `toolUse`, i.e. unchecked; compaction actually
    #     fired at tokensBefore=360452 — 28K past the trigger, 11K from the wall.
    #   - other sessions lost the race outright: consecutive toolUse messages
    #     climbing 360731 -> 370478, then "Your input exceeds the context window
    #     of this model" (>=0.84.0 then compact-and-retries, at the cost of a
    #     wasted request); one truncated at `length` with tot=371566.
    # maxTokens is 128K, so reserve >= 128K is the correctness floor: a single
    # maximal response must not be able to cross the wall on its own. 130K fires
    # at 242K ≈ 65% and leaves 130K of headroom instead of 40K. This lowers the
    # probability of hitting the wall; it cannot eliminate it, because no
    # threshold can bound growth that is never measured.
    # Accepted costs: usable working context 332K -> 242K, and compaction runs
    # more often (more lossy summaries, more prompt-cache invalidation). Note
    # reserveTokens is double-duty — the summary's own output budget is
    # min(0.8*reserveTokens, maxTokens) = 104K here (core/compaction/
    # compaction.js), a cap rather than a target.
    # Bonus: 242K now sits BELOW the 272K premium-pricing line, so the tail of a
    # long session no longer bills at 2x input / 1.5x output.
    #
    # This is now the ONLY compaction trigger. The locally authored
    # pi-early-compaction extension was deleted on 2026-08-08: it re-checked the
    # same `contextWindow - reserveTokens` inequality at every tool-use turn_end
    # with a hardcoded reserve of 96000 — identical to the native value — and
    # drove it through `ctx.compact()`, whose first act is `await this.abort()`.
    # That abort ends the agent run, so pi's own post-run `_checkCompaction`
    # fired on the same crossing and raced the extension's still-in-flight
    # manual compaction. Both prepared from the same state (identical
    # `Compacted from N tokens` lines); the loser threw `Already compacted`.
    # Same trap that removed pi-continue. Do NOT reintroduce a second trigger
    # sharing this threshold. A LOWER threshold would dodge that particular race
    # (the native check would see a sub-threshold context and return false), but
    # it is still not a fix: `ctx.compact()` opens with `await this.abort()`,
    # which ends the agent run — so any extension-driven mid-loop compaction
    # severs the tool loop it was meant to protect. Sizing reserveTokens is the
    # only clean lever pi exposes; there is no interval/percentage knob
    # (getCompactionSettings reads exactly enabled/reserveTokens/
    # keepRecentTokens).
    compaction:
      enabled: true
      reserveTokens: 130000
      keepRecentTokens: 16000
    # Keep /tree branch summarization behavior explicit across Pi upgrades.
    # Reserve 16K tokens for the summary and continue prompting before summarizing.
    branchSummary:
      reserveTokens: 16384
      skipPrompt: false
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxRetryDelayMs: 4000
  # ===== Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this settings field when it resolves
  # resources. Keep third-party packages explicit here instead of using a
  # dedicated chezmoi installer script.
  packages:
    - npm:pi-mcp-adapter
    # Statusline is VENDORED (fork of @narumitw/pi-statusline) at
    # dot_pi/agent/extensions/pi-statusline so we can trim it — do NOT re-add the
    # `npm:@narumitw/pi-statusline` entry here: it double-loads with the vendored
    # copy and the npm copy wins, making local edits dead (same trap as
    # pi-input-history). The fork drops the π brand, the decorative per-segment
    # emoji, and (2026-08-09) the five segments that duplicate what is already on
    # screen: cwd (shell prompt + window title), tools (the tool card itself),
    # tokens (`context` carries the number that matters), cost (a running total,
    # not a per-turn signal) and time (the system clock). DEFAULT_SEGMENTS in
    # src/statusline.ts is now model/thinking/branch/context — e.g.
    # `gpt-5.6-sol · think max · ⎇ main · ctx 42%`; edit that array to restore any.
    # Active `classic` preset (env PI_STATUSLINE_PRESET=classic in dot_zshenv)
    # follows the Pi theme. Extension-status icons (2nd line) are tunable via
    # ~/.pi/agent/pi-statusline-settings.json extensionStatusIcons ("" removes one).
    # In-process subagents use the built-in general-purpose/Explore/Plan definitions
    # via disableDefaultAgents:false in dot_pi/agent/subagents.json. All three are
    # pinned to openai-codex/gpt-5.6-luna at thinking `max` (user request 2026-08-05):
    # same OpenAI Codex OAuth provider as the parent, one tier down on price so the
    # fan-out is cheap, but with reasoning effort left at the top. Pins live in each
    # dot_pi/agent/agents/*.md frontmatter (`model:` + `thinking:`).
    # UNPINNED on 2026-08-08 (was `@0.13.0`). The pin was the only versioned spec in
    # this list, and `pi update --extensions` (script 20) skips version-pinned specs —
    # so it silently froze while everything else tracked latest. 0.13.0 snapshots
    # `extension.tools` into a static allowlist *before* `session_start` fires, and pi
    # gates tool REGISTRATION on that list, so every MCP-backed tool (tavily, context7,
    # deepwiki, gitmcp, arxiv, markitdown) was permanently dropped from every subagent —
    # while Explore.md's prompt still instructed it to use them. 0.14.3 fixes exactly
    # this (upstream #141); 0.14.1 also makes `thinking: max` an advertised level rather
    # than one that happened to work. Peer floor is pi >=0.80.0, satisfied here.
    - npm:@tintinweb/pi-subagents
    # Browser-cookie and private web-session extensions are intentionally excluded.
    # Web research stays on API-backed MCP providers; built-in OpenAI Codex OAuth
    # remains the only permitted subscription-backed integration in this setup.
    # Permission policy engine: allow/ask/deny gates over tools, bash, path,
    # external_directory, mcp. Policy at dot_pi/agent/extensions/pi-permission-system/
    # config.json. Fails CLOSED — keep JSON strict (no comments/trailing commas).
    - npm:@gotgenes/pi-permission-system
    # readseek: hash-anchored read/edit/grep + structural code maps/search.
    # Primary code-nav tool since serena was removed (2026-07-31).
    - npm:pi-readseek
    # hypa: local context runtime — long-context compression, deterministic
    # reducers + evidence record; rewrites shell/read/grep/find/ls and proxies
    # MCP to cut context pollution. Top-downloaded Pi package; pairs with readseek.
    - npm:@hypabolic/pi-hypa
    # caffeinate: inhibits macOS sleep (system `caffeinate`) while the agent is
    # processing a long turn; releases on idle/shutdown. /caffeinate to control.
    # Zero deps. Disable with PI_CAFFEINATE_DISABLED=1.
    - npm:@narumitw/pi-caffeinate
    # goal: `/goal <objective>` autonomous mode — keeps working until goal_complete
    # or a token budget (--tokens) is hit. Pairs well with long-context models;
    # switch to deepseek-v4-pro when a 1M window matters more than the GPT default.
    # Zero deps; state is session-scoped.
    - npm:@narumitw/pi-goal
    # gpt-fast: also NOT listed here — local extension at
    # dot_pi/agent/extensions/pi-gpt-fast.ts. `/gpt-fast [on|off|toggle]` (and
    # `pi --gpt-fast`) injects `service_tier: "priority"` into OpenAI/Codex
    # requests via the `before_provider_request` hook — same model, same
    # reasoning effort, lower latency. Upstream prior art measured 1.57x wall on
    # gpt-5.6-sol and 2.25x on gpt-5.6-luna. NOT installed from npm on purpose:
    # calesennett/pi-codex-fast carries no license at all, and the unscoped
    # `pi-codex-fast` on npm is a DIFFERENT author's package (wobondar); the MIT
    # alternative, npm:pi-openai-fast-mode, names its command `/fast` and renders
    # its indicator as a full-width widget instead of a footer status. State
    # persists under the `pi-gpt-fast` key in ~/.pi/agent/settings.json, which
    # the modify_ script preserves.
    # input-history: NOT listed here — it is VENDORED (locally forked/魔改) at
    # dot_pi/agent/extensions/pi-input-history/ and auto-discovered from
    # ~/.pi/agent/extensions/, so no `npm:` entry is needed (listing it too would
    # double-load it and the npm copy would win, shadowing the local edits — see
    # the extension conflict pi reports when both exist). Our fork replaces the
    # single-line reverse-search with a full fzf/atuin-style popup list (Ctrl+R).
    # Reworked 2026-08-09 into a `fzf --preview` two-pane dialog (90% wide, 85%
    # tall): left = newest-first list, each row `<n> <age> <summary>`; right =
    # the FULL text of the highlighted entry, ctrl+d/u to scroll it. Ages come
    # from each session entry's `timestamp`. Arrows/ctrl+p/ctrl+n follow the
    # list; ctrl+r/ctrl+s keep their shell meaning (ctrl+r walks older). Under
    # 76 columns the preview is dropped and the list goes full-width.
    # Ctrl+R is claimed for that popup; Pi's built-in app.session.rename is moved
    # off Ctrl+R to shift+r in dot_pi/agent/keybindings.json to avoid the clash.
  # ===== Vendored fork upstreams (advisory watch, used by script 20) =====
  # Every other pi component has a periodic update path: the CLI rides mise `latest`
  # + `mise up` (script 23), and the `packages` above ride `pi update --extensions`
  # (script 20). The VENDORED extensions under dot_pi/agent/extensions/ have neither —
  # they are local forks, so nothing can update them without clobbering the local
  # changes, and their drift is invisible until something breaks.
  #
  # This list does not update them. It tells the weekly script which upstream to watch
  # so it can report "upstream published X since you last looked" and leave the rebase
  # decision to a human. Only forks that HAVE an upstream belong here — pi-input-prefix,
  # tmux-state and herdr-pi-state are locally authored.
  #
  # NOTE: a fork's own `version` in package.json is NOT comparable to upstream's (the
  # input-history fork sits at 1.1.0 while upstream is 1.0.1), which is exactly why the
  # check watches for *changes* in the upstream release instead of diffing versions.
  vendoredForks:
    - dir: pi-statusline
      upstream: "@narumitw/pi-statusline"
    - dir: pi-input-history
      upstream: pi-input-history
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Only providers/models Pi does not ship natively belong here. Built-in model
  # IDs must not be repeated because a custom entry with the same ID replaces
  # Pi's metadata, including its supported thinking levels and pricing tiers.
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    openai-codex: # BUILT-IN provider — this entry only PATCHES model metadata.
      # `auth: builtin` emits no apiKey, so the existing Codex OAuth in
      # ~/.pi/agent/auth.json keeps working; `modelOverrides` patches single
      # fields without replacing the provider's model list (a `models:` entry
      # with a matching id would replace the built-in model wholesale — not
      # what we want here).
      #
      # Why: gpt-5.6-sol's published spec is a 1,050,000 context window, but
      # Codex's server-delivered catalog reports 272,000 — see
      # ~/.pi/agent/models-store.json, which pi refreshes over HTTP. That 272K
      # is a BILLING boundary, not a capability limit: OpenAI prices prompts
      # over 272K input at 2x input / 1.5x output for the FULL request, and
      # Codex pinned its catalog to the line so default sessions cannot
      # silently cross it (codex PR #33972, merged 2026-07-18, cut the catalog
      # from 372,000 to 272,000; issue #32486 is the complaint it answered).
      # Before that PR, 372,000 was Codex's real value — the old comment in
      # this file was correct when written and was invalidated upstream.
      #
      # 372,000 restores the pre-2026-07-18 Codex window. Tokens between 272K
      # and the 332K compaction trigger DO bill at the premium tier, which is
      # the accepted trade for the extra headroom. Raise to 1050000 for the
      # full published window, or delete this block to fall back to the
      # server catalog's 272,000 (and drop reserveTokens back to ~40K/272K).
      # An OpenAI engineer has said the cut is temporary and 372K will return;
      # once the catalog reports it again this block becomes a no-op.
      #
      # Verify any change with `pi --list-models gpt-5.6-sol`, never by
      # reading this comment.
      auth: builtin
      modelOverrides:
        gpt-5.6-sol: { contextWindow: 372000 }
        # Subagents run luna (dot_pi/agent/agents/*.md); terra is included so a
        # runtime /model switch does not silently drop back to 272K.
        gpt-5.6-luna: { contextWindow: 372000 }
        gpt-5.6-terra: { contextWindow: 372000 }
    deepseek: # DeepSeek Platform (OpenAI-compatible). V4 models are not in Pi's
      # built-in registry yet, so we pin them here with the reasoning `compat`
      # block from the official integration doc:
      # https://api-docs.deepseek.com/quick_start/agent_integrations/pi_mono
      base_url: https://api.deepseek.com
      api: openai-completions
      gopass: claude/deepseek/private/api_key
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0 }
          # DeepSeek V4 currently exposes one reasoning mode; preserve the old
          # intent by mapping every Pi level through xhigh to provider `high`.
          thinkingLevelMap:
            { minimal: high, low: high, medium: high, high: high, xhigh: high }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          reasoning: true
          cost: { input: 0.14, output: 0.28, cacheRead: 0.028, cacheWrite: 0 }
          thinkingLevelMap:
            { minimal: high, low: high, medium: high, high: high, xhigh: high }
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
    krill: # Krill — GPT-5.x served on an OpenAI-Responses endpoint
      # (https://api.krill-ai.com). Same upstream Claude Code (anthropic-compatible
      # /codex) and Codex (openai-responses /codex/v1) already use; here we take the
      # Responses route because that's the GPT-5.x native transport, mirroring
      # dot_codex [model_providers.krill] (base_url .../codex/v1, wire_api=responses).
      # Pi's openai-responses api POSTs to <base_url>/responses, so keep the /codex/v1
      # suffix. Key from gopass (claude/krill/private/api_key, the same secret the
      # claude/codex configs read) → baked in at apply time, so
      # `pi --provider krill --model gpt-5.6-sol` works out of the box; the provider is
      # silently skipped on a machine without the key. Pick at runtime with /model.
      base_url: https://api.krill-ai.com/codex/v1
      api: openai-responses
      gopass: claude/krill/private/api_key
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol (krill)
          # Krill live-check: /responses accepts Sol/Terra/Luna but not the bare
          # gpt-5.6 alias. The gateway is conservatively capped at 371K context.
          # GPT-5.6 rejects minimal, so map it to low; expose native xhigh and max.
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 6.25 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra (krill)
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 3.125 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna (krill)
          contextWindow: 371000
          maxTokens: 128000
          reasoning: true
          cost: { input: 1, output: 6, cacheRead: 0.1, cacheWrite: 1.25 }
          thinkingLevelMap:
            {
              minimal: low,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: max,
            }
        - id: gpt-5.5
          name: GPT-5.5 (krill)
          # Gateway-specific fallback retained at its existing explicit limit;
          # do not substitute OpenAI/Codex limits without a Krill boundary probe.
          contextWindow: 400000
          maxTokens: 128000
          reasoning: true
          # gpt-5.5 accepts effort up to xhigh, so map identity and do NOT let Pi
          # clamp xhigh down to high.
          thinkingLevelMap:
            {
              minimal: minimal,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
            }
    qwen: # Alibaba DashScope (OpenAI-compatible)
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: openai-completions
      env: DASHSCOPE_API_KEY
      # Keep limits explicit: string-only entries inherit Pi's generic 128K/16K
      # defaults, which are wrong for both hosted Qwen models.
      models:
        - id: qwen3-coder-plus
          contextWindow: 1000000
          maxTokens: 65536
        - id: qwen3-max
          contextWindow: 262144
          maxTokens: 65536
    doubao: # ByteDance Ark v3 (OpenAI-compatible)
      base_url: https://ark.cn-beijing.volces.com/api/v3
      api: openai-completions
      env: ARK_API_KEY
      models:
        - id: doubao-seed-1-6-thinking-250715
          contextWindow: 256000
          maxTokens: 16000
