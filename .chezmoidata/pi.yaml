pi:
  # Pi Coding Agent configuration
  # Repo: https://github.com/earendil-works/pi  (npm @earendil-works/pi-coding-agent)
  #
  # Pi natively supports multiple providers: it ships a built-in model registry
  # (anthropic, openai, deepseek, zai/glm, kimi-coding, minimax, google, xai,
  # groq, ...) and switches provider/model at runtime via `/model`, with auth via
  # `/login`, env vars, or ~/.pi/agent/auth.json. So no account-switching wrappers
  # are needed — this file only sets the startup default and any CUSTOM (non
  # built-in) providers.

  # ===== Startup defaults -> ~/.pi/agent/settings.json =====
  defaults:
    # Signalridge Ridgeline: a deep, low-noise surface with violet interaction
    # focus, cyan information, and semantic green/amber/red state colors. The
    # rounded input editor and startup card consume these same Pi theme tokens;
    # no extension carries a second hard-coded palette. Dracula and Aurora remain
    # available from `/settings` for rollback.
    theme: signalridge-ridgeline
    # Silence Pi's own startup header and [Section] resource listing so the
    # pi-welcome card is the whole opening screen. Keeping both showed two
    # unrelated designs stacked to roughly forty-five lines. The card carries
    # the pieces worth keeping — the key hints, and counts of context files,
    # skills, prompts, commands and tools derived from Pi's public API — and
    # diagnostics (resource collisions, extension load errors) are still shown
    # while quiet, so nothing actionable is hidden. Set false to get Pi's own
    # block back above the card.
    quietStartup: true
    # User-requested (2026-08-17): ONE model runs everything — the parent session
    # and all three pi-subagents tiers are opencode-go/deepseek-v4-flash at
    # thinking level max. openai-codex keeps its OAuth in ~/.pi/agent/auth.json
    # and stays one `/model` switch away, as do Kimi Code and the DIRECT DeepSeek
    # platform below.
    # The route is the opencode Go SUBSCRIPTION gateway, not DeepSeek's own API.
    # Both carry the same model; they differ in billing (flat allowance vs
    # per-token), in key (`pi/opencode/api_key` vs `pi/deepseek/api_key`), and in
    # advertised effort ladder. The direct provider is kept configured as the
    # fallback — reach it as `deepseek/deepseek-v4-flash`.
    # VERIFIED END TO END 2026-08-17: `pi/opencode/api_key` authenticates and all
    # 19 built-in opencode-go models answer on their own protocol. A live
    # deepseek-v4-flash call with reasoning_effort=max returned `content` +
    # `reasoning_content` and 92 reasoning_tokens, confirming both the `max` rung
    # and the deepseek thinkingFormat. `deepseek/deepseek-v4-flash` (direct,
    # per-token) is the verified fallback.
    defaultProvider: opencode-go
    # The parent model + effort are still emitted from
    # dot_pi/agent/modify_settings.json.tmpl rather than from here, because that is
    # where settings.json is assembled — but they are no longer machine-scoped: both
    # `work` and private resolve to deepseek-v4-flash at max, so the chezmoi `work`
    # ternaries that used to pick between gpt-5.6-luna/xhigh and gpt-5.6-luna/max
    # are gone. Pi remains configured independently from Codex.
    # Trigger threshold = contextWindow - reserveTokens, where contextWindow is
    # the ACTIVE provider/model's. The two candidates differ by more than 2x, and
    # reserveTokens is a single global number, so it has to satisfy BOTH:
    #   opencode-go   muse-spark-1.2     1M     (the startup default -> what applies)
    #   openai-codex  gpt-5.6-luna       372K   (the /model fallback)
    # The startup default moved deepseek-v4-flash -> muse-spark-1.2 on 2026-08-19.
    # Every number below survives that move unchanged: both are 1M-window models
    # pinned to maxTokens 128000, so the floor, the trigger and the headroom are
    # identical. deepseek-v4-flash stays configured and keeps its own 128K pin.
    # A reserve sized for flash's real 384K output cap (>= 384000) would make
    # `372000 - reserveTokens` NEGATIVE and put every codex turn permanently over
    # the threshold. That is why BOTH deepseek-v4-flash entries below (the
    # opencode-go one and the direct one) carry a `modelOverrides` pin of
    # maxTokens 128000 over the built-in registry's true 384000 — see the comments
    # there. Every other model keeps its real output cap, so a /model switch to
    # e.g. grok-4.5 (500K out) or kimi-k2.7-code (262K) re-enters this landmine.
    #
    # SIZING (measured 2026-08-09, not theoretical). Pi evaluates the threshold
    # at only two points — after an agent run ends and before the next prompt
    # (the two `_checkCompaction` call sites in core/agent-session.js) — and
    # NEVER between tool calls. reserveTokens is therefore not just a trigger
    # offset: it is the UNCHECKED HEADROOM that one entire tool loop plus its
    # final response has to fit inside. Size it against a loop, not a turn.
    # Evidence under the previous 40K reserve (trigger 332K):
    #   - session 2026-08-08T15-57 (~/.pi/agent/sessions): 76 of 88 assistant
    #     messages stopped on `toolUse`, i.e. unchecked; compaction actually
    #     fired at tokensBefore=360452 — 28K past the trigger, 11K from the wall.
    #   - other sessions lost the race outright: consecutive toolUse messages
    #     climbing 360731 -> 370478, then "Your input exceeds the context window
    #     of this model" (>=0.84.0 then compact-and-retries, at the cost of a
    #     wasted request); one truncated at `length` with tot=371566.
    # maxTokens is 128K for BOTH candidates — natively on codex, and by the
    # deliberate modelOverrides pin in the opencode-go block below — so 128K is the
    # correctness floor: a single maximal response must not be able to cross the
    # wall on its own. 130K clears that floor and leaves 130K of unchecked
    # headroom instead of 40K. This lowers the probability of hitting the wall;
    # it cannot eliminate it, because no threshold can bound growth that is never
    # measured. Where 130K lands, per active model:
    #   opencode-go/deepseek-v4-flash  1M   -> trigger 870K (87%)
    #   openai-codex/gpt-5.6-luna      372K -> trigger 242K (65%)
    # Accepted costs: on the codex fallback, usable working context 332K -> 242K
    # and compaction runs more often (more lossy summaries, more prompt-cache
    # invalidation). Note reserveTokens is double-duty — the summary's own output
    # budget is min(0.8*reserveTokens, maxTokens) = 104K here (core/compaction/
    # compaction.js), a cap rather than a target.
    # Bonus, codex fallback only: 242K sits BELOW the 272K premium-pricing line,
    # so the tail of a long session no longer bills at 2x input / 1.5x output.
    # DeepSeek has no equivalent pricing cliff — it bills one flat per-token rate
    # (discounted off-peak) with no context-length tier — so the 870K trigger on
    # the default model is a context-safety number only.
    #
    # This is now the ONLY compaction trigger. The locally authored
    # pi-early-compaction extension was deleted on 2026-08-08: it re-checked the
    # same `contextWindow - reserveTokens` inequality at every tool-use turn_end
    # with a hardcoded reserve of 96000 — identical to the native value — and
    # drove it through `ctx.compact()`, whose first act is `await this.abort()`.
    # That abort ends the agent run, so pi's own post-run `_checkCompaction`
    # fired on the same crossing and raced the extension's still-in-flight
    # manual compaction. Both prepared from the same state (identical
    # `Compacted from N tokens` lines); the loser threw `Already compacted`.
    # Same trap that removed pi-continue. Do NOT reintroduce a second trigger
    # sharing this threshold. A LOWER threshold would dodge that particular race
    # (the native check would see a sub-threshold context and return false), but
    # it is still not a fix: `ctx.compact()` opens with `await this.abort()`,
    # which ends the agent run — so any extension-driven mid-loop compaction
    # severs the tool loop it was meant to protect. Sizing reserveTokens is the
    # only clean lever pi exposes; there is no interval/percentage knob
    # (getCompactionSettings reads exactly enabled/reserveTokens/
    # keepRecentTokens).
    compaction:
      enabled: true
      reserveTokens: 130000
      keepRecentTokens: 16000
    # Keep /tree branch summarization behavior explicit across Pi upgrades.
    # Reserve 16K tokens for the summary and continue prompting before summarizing.
    branchSummary:
      reserveTokens: 16384
      skipPrompt: false
    # Resolve/install Pi packages with bun instead of npm (faster, no
    # package-lock.json). Pi dispatches package ops via settings `npmCommand`
    # (default ["npm"]); the switch is global across all `npm:` packages below.
    # Revert: remove this key, `chezmoi apply`, delete ~/.pi/agent/npm, `pi update`.
    npmCommand: ["bun"]
    # Bounded retry: cap escalating backoff so a transient upstream error (e.g. a
    # gateway HTTP 429) fails fast and surfaces — then just /model switch —
    # instead of hanging. Still retries twice for genuine transient recovery.
    retry:
      enabled: true
      maxRetries: 2
      maxRetryDelayMs: 4000
  # ===== Pi packages -> ~/.pi/agent/settings.json packages =====
  # Pi installs missing packages from this settings field when it resolves
  # resources. Keep third-party packages explicit here instead of using a
  # dedicated chezmoi installer script.
  # ===== External Pi packages -> ~/.pi/agent/settings.json =====
  # Infrastructure owned by the runtime environment rather than by
  # signalridge/pi-extensions. Signalridge packages are listed separately below
  # and rendered with the `npm:@signalridge/` prefix.
  packages:
    - npm:pi-mcp-adapter
    - npm:pi-web-access
    - npm:@gotgenes/pi-permission-system
    - npm:pi-readseek
    - npm:@hypabolic/pi-hypa
  # ===== Signalridge Pi packages -> ~/.pi/agent/settings.json =====
  # Published packages from github.com/signalridge/pi-extensions, installed from
  # npm by Pi itself. Bare names only: modify_settings.json.tmpl renders each as
  # `npm:@signalridge/<name>` with NO version, so Pi resolves the latest release
  # on first install and run_after_20_update-pi-extensions.sh keeps it current.
  # Never add a `@version` suffix here — pinning is deliberately not done.
  #
  # The checkout at ~/ghq/github.com/signalridge/pi-extensions is a development
  # source only; Pi must not load it, or any legacy ~/.pi/agent/extensions copy,
  # as a second implementation of the same extension.
  #
  # Excluded on purpose:
  #   pi-worktree   — repository constitution forbids worktrees (CLAUDE.md Art. 1)
  #   pi-worktime   — publishable but opt-in; not yet released to npm
  #   pi-recall, pi-codex-compact, pi-analytics — experimental, opt-in
  #   pi-subagents-protocol — pure library, a dependency and never a Pi resource
  signalridgePackages:
    # Orchestration
    - pi-subagents
    - pi-workflows
    - pi-goal
    - pi-ralph-wiggum
    - pi-plan-mode
    # Environment bridges
    - pi-herdr-state
    - pi-gpt-fast
    - pi-agent-guidance
    # Input, chrome, and session UI
    - pi-input-history
    - pi-input-prefix
    - pi-statusline
    - pi-tab-status
    - pi-welcome
    - pi-session-recap
    - pi-usage-extension
    - pi-stamp
    # Developer tools
    - pi-lsp
    - pi-github-pr
    - pi-files-widget
    - pi-code-actions
    - pi-btw
  # ===== Custom providers -> ~/.pi/agent/models.json =====
  # Only providers/models Pi does not ship natively belong here. Built-in model
  # IDs must not be repeated because a custom entry with the same ID replaces
  # Pi's metadata, including its supported thinking levels and pricing tiers.
  #
  # API key, per provider:
  #   env: <VAR>     -> models.json gets apiKey "$<VAR>" (no secret on disk; set
  #                     the env var or authenticate via /login -> auth.json).
  #   gopass: <path> -> the key is read with `gopass show` at `chezmoi apply` time
  #                     and baked into models.json (same approach as aichat). The
  #                     provider is silently skipped if the key is missing, so
  #                     `chezmoi apply` still works on a fresh machine.
  #
  # models: a plain string is shorthand for {id: <string>}; a map is passed
  # through verbatim (id/name/contextWindow/maxTokens/reasoning/cost/compat/...).
  # Pick a model at runtime with /model.
  customProviders:
    opencode-go: # BUILT-IN provider — this entry ONLY supplies the API key + 1 patch.
      # THE STARTUP DEFAULT (deepseek-v4-flash at thinking max).
      #
      # Pi SHIPS opencode-go natively (pi-ai dist/providers/data/opencode-go.json,
      # 19 models). Do NOT re-declare its catalogue here. The Go gateway speaks
      # THREE protocols on the same host and pi's built-in already records the
      # right one per model:
      #   openai-completions  https://opencode.ai/zen/go/v1   deepseek-v4-{flash,pro},
      #                       glm-5.{1,2,3}, kimi-k{3,2.7-code,2.6}, mimo-v2.5{,-pro},
      #                       minimax-m2.7, qwen3.6-plus, hy3
      #   openai-responses    https://opencode.ai/zen/go/v1   gpt-5.6-luna, grok-4.5
      #   anthropic-messages  https://opencode.ai/zen/go      minimax-m3,
      #                       qwen3.{7-max,7-plus,8-max}      <- NOTE: no /v1
      # All three paths verified live (POST returns a semantic error, not 404;
      # /messages needs x-api-key rather than Bearer, which pi handles per api type).
      #
      # WHY key-only matters: `applyModelsJson` (pi-coding-agent
      # dist/core/provider-composer.js:96) does
      #   baseUrl: config.baseUrl ?? model.baseUrl
      # over EVERY built-in model, so a provider-level `base_url` here would
      # overwrite the anthropic models' `/zen/go` with `/zen/go/v1` and produce
      # `/zen/go/v1/v1/messages`. A provider-level `api` collapses all three
      # protocols the same way, and a `models:` list upserts over the built-ins
      # with whatever this file guesses. An earlier revision of this block did
      # exactly that — 25 models from models.dev, one base_url, one api — which is
      # wrong for the 6 non-chat-completions models. models.dev only carries a
      # PROVIDER-level `npm: @ai-sdk/openai-compatible` (the majority protocol),
      # never a per-model one, so it cannot be the source for this.
      # A config carrying only `apiKey` is explicitly legal (same function,
      # lines 86-95) and leaves baseUrl/api/compat/models untouched.
      #
      # The built-in metadata is also better than anything derivable here:
      # deepseek-v4-flash already carries thinkingLevelMap `max: max` (so the pin
      # is not silently downgraded — see the direct provider below for what that
      # bug looks like) plus a fuller compat block (supportsStore,
      # supportsDeveloperRole, maxTokensField, requiresReasoningContentOn-
      # AssistantMessages, thinkingFormat), and its cost fields are the Go
      # allowance-draw rates, not models.dev's per-token list price. Its name even
      # records the plan's "(2x usage)" multiplier.
      #
      # Not in pi's built-in but advertised by GET /zen/go/v1/models: glm-5,
      # kimi-k2.5, qwen3.5-plus, mimo-v2-pro, mimo-v2-omni, hy3-preview — plus
      # minimax-m2.5, which opencode's docs table lists and pi omits. Left out on
      # purpose: adding them needs a per-model `api`/`baseUrl` guess, and the two
      # sources already disagree on protocol for minimax-m2.7 and qwen3.6-plus.
      #
      # Docs: https://opencode.ai/docs/zen/  Keys: https://opencode.ai/auth
      # Two workspace-level gates were hit while configuring this, both since
      # cleared — recorded because they present as config errors and are not:
      #   CreditsError  every model, until the workspace has a payment method
      #                 (/workspace/<id>/billing)
      #   RegionError   deepseek-v4-{flash,pro} only, until "models hosted in
      #                 China" is opted into (/workspace/<id>/go). A SEPARATE
      #                 switch that paying does not clear — opencode serves US
      #                 hosts by default, but DeepSeek V4's latest build is
      #                 China-only, so consent is required. Browser only; there is
      #                 no API path to opt in.
      # Verified 2026-08-17 after clearing both: all 19 built-in models answer on
      # their own protocol, and a deepseek-v4-flash call at reasoning_effort=max
      # returned reasoning_content with 92 reasoning_tokens.
      gopass: pi/opencode/api_key
      models:
        # THE ONE MODEL THIS BLOCK ADDS. Everything else the Go docs table lists
        # is already built in — do not add the rest (see the warning above).
        #
        # Audited 2026-08-19 against `GET /zen/go/v1/models` (27 ids) and
        # models.dev: the gateway's 20 CURRENT models are exactly pi 0.84.2's 19
        # built-ins plus muse-spark-1.2 (released 2026-08-05, after pi's
        # registry snapshot). The other 6 gateway ids — glm-5, kimi-k2.5,
        # mimo-v2-pro, mimo-v2-omni, qwen3.5-plus, minimax-m2.5 — all carry
        # models.dev `status: deprecated` and are deliberately omitted. That
        # retires the older note above about minimax-m2.7 / qwen3.6-plus
        # "protocol disagreement": both ids were probed live on 2026-08-19 and
        # BOTH answer 200 on /v1/chat/completions AND /v1/messages, so the
        # gateway multiplexes and the built-in's openai-completions choice is
        # not a conflict. Nothing to patch there.
        #
        # DATA-POLICY GATE — opted in 2026-08-19, verified working. This is a
        # THIRD workspace gate, distinct from the CreditsError and RegionError
        # documented above, and unlike them it trades data for access: prompts
        # and code sent to this model are retained for training. Until the
        # workspace opts in (browser only, no API path, at
        # https://opencode.ai/workspace/<workspace-id>/go) every call returns
        #   HTTP 403 DataPolicyError: "This model collects data used to improve
        #   its quality and requires explicit opt in"
        # so expect that on any OTHER workspace this key is used from. Delete
        # this entry instead if that trade is not wanted.
        #
        # api/baseUrl are MANDATORY here, not optional polish: for an id absent
        # from the built-ins, provider-composer.js:102 falls back to
        # `defaults = models[0]` — the first model of the base list, whose
        # protocol is unrelated. Every other field is spelled out for the same
        # reason: modelFromJson reads ONLY api and baseUrl from `defaults` and
        # resets the rest to hardcoded values (contextWindow 128000, maxTokens
        # 16384, reasoning false, zero cost).
        - id: muse-spark-1.2
          name: Muse Spark 1.2
          api: openai-responses
          # No trailing /v1 mismatch: the responses route is …/zen/go/v1, the
          # anthropic one is …/zen/go. Same split as the built-ins.
          baseUrl: https://opencode.ai/zen/go/v1
          reasoning: true
          # models.dev advertises image/video/pdf/audio too; kept to the pair the
          # built-in opencode-go models declare, since the extra modalities are
          # unverified on this gateway.
          input: [text, image]
          contextWindow: 1048576
          # PINNED DOWN from its real cap of 131072, for the same reason
          # deepseek-v4-flash is pinned down from 384000 in modelOverrides
          # below: reserveTokens is a single global 130000 and the SIZING block
          # above sets a `reserveTokens >= maxTokens` correctness floor, so that
          # one maximal response cannot cross the context wall unchecked on its
          # own. 131072 misses that floor by 1072. The 3072-token haircut (2.3%)
          # is the cheapest way to keep the floor exact, and it matters more
          # here than for a model reachable only by a manual /model switch:
          # subagents.json.tmpl routes EVERY subagent tier through this model.
          # Its 1M window is untouched — the compaction trigger is
          # 1048576 - 130000 = 918576 (88%), which is roomy.
          maxTokens: 128000
          cost: { input: 0.1, output: 0.2, cacheRead: 0.002, cacheWrite: 0 }
          # Uniform across this gateway's openai-responses route, not a per-model
          # quirk: gpt-5.6-luna, grok-4.5 and upstream's own
          # muse-spark-1.2-contributor all carry it, so its absence here was a gap.
          compat:
            sessionAffinityFormat: openai-nosession
          # models.dev reasoning_options.effort = minimal|low|medium|high|xhigh.
          # There is NO `max` rung, so `max` is mapped to the real top (xhigh)
          # rather than dropped — the global defaultThinkingLevel is `max`, and a
          # null here would silently send no effort at all.
          # NOT load-bearing — kept as explicit documentation only. An earlier
          # revision of this file claimed that without it every call would fail,
          # because the gateway does reject `"effort":"max"` outright
          # (invalid_request_error, probed 2026-08-19, while
          # minimal/low/medium/high/xhigh all answer 200). That claim was WRONG:
          # pi never sends `max` here with or without this line. With no `max`
          # key, getSupportedThinkingLevels marks the rung unsupported and
          # clampThinkingLevel drops to xhigh on its own — confirmed by deleting
          # the key and re-running `pi -p --model opencode-go/muse-spark-1.2:max`,
          # which still answered normally. Writing it out just makes `max` a
          # first-class supported rung instead of a clamped one; same request on
          # the wire. Upstream's own muse-spark-1.2-contributor ships max -> null,
          # which is equally correct, not a defect to be reconciled.
          thinkingLevelMap:
            {
              off: null,
              minimal: minimal,
              low: low,
              medium: medium,
              high: high,
              xhigh: xhigh,
              max: xhigh,
            }
      modelOverrides:
        # Built-in says 384000. reserveTokens is one global number with a
        # `reserveTokens >= maxTokens` floor (see the SIZING block above), so the
        # startup default has to fit under 130000 or the openai-codex fallback
        # (372K window) compacts every turn. 128K is ~4x a normal agentic response.
        # Every other opencode-go model keeps its real cap, so a /model switch to
        # grok-4.5 (500K out) or kimi-k2.7-code (262K) re-enters that landmine.
        deepseek-v4-flash: { maxTokens: 128000 }
    openai-codex: # BUILT-IN provider — this entry only PATCHES model metadata.
      # `auth: builtin` emits no apiKey, so the existing Codex OAuth in
      # ~/.pi/agent/auth.json keeps working; `modelOverrides` patches single
      # fields without replacing the provider's model list (a `models:` entry
      # with a matching id would replace the built-in model wholesale — not
      # what we want here).
      #
      # Why: gpt-5.6-sol's published spec is a 1,050,000 context window, but
      # Codex's server-delivered catalog reports 272,000 — see
      # ~/.pi/agent/models-store.json, which pi refreshes over HTTP. That 272K
      # is a BILLING boundary, not a capability limit: OpenAI prices prompts
      # over 272K input at 2x input / 1.5x output for the FULL request, and
      # Codex pinned its catalog to the line so default sessions cannot
      # silently cross it (codex PR #33972, merged 2026-07-18, cut the catalog
      # from 372,000 to 272,000; issue #32486 is the complaint it answered).
      # Before that PR, 372,000 was Codex's real value — the old comment in
      # this file was correct when written and was invalidated upstream.
      #
      # 372,000 restores the pre-2026-07-18 Codex window. Tokens between 272K
      # and the 332K compaction trigger DO bill at the premium tier, which is
      # the accepted trade for the extra headroom. Raise to 1050000 for the
      # full published window, or delete this block to fall back to the
      # server catalog's 272,000 (and drop reserveTokens back to ~40K/272K).
      # An OpenAI engineer has said the cut is temporary and 372K will return;
      # once the catalog reports it again this block becomes a no-op.
      #
      # Verify any change with `pi --list-models gpt-5.6-sol`, never by
      # reading this comment.
      auth: builtin
      modelOverrides:
        gpt-5.6-sol: { contextWindow: 372000 }
        # Local planning/implementation/review agents run luna; terra is included so
        # a runtime /model switch does not silently drop back to 272K.
        gpt-5.6-luna: { contextWindow: 372000 }
        # THINKING LADDER — exactly ONE repair is needed here, and only here.
        # Audited 2026-08-19 across every model in ~/.pi/agent/models-store.json.
        # pi ALREADY handles ladder mismatches by itself and needs no help in the
        # general case: getSupportedThinkingLevels treats a `null` value — and, for
        # xhigh/max only, an ABSENT key — as "this model does not offer that rung",
        # then clampThinkingLevel walks up and, failing that, down to the nearest
        # rung the model does offer (pi-ai/dist/models.js). So `max` on a model
        # topping out at xhigh is sent as xhigh with no config at all. Verified by
        # deleting keys and re-running: opencode-go/deepseek-v4-flash answers at
        # :minimal, :medium, :xhigh and :max although its map nulls minimal and
        # medium and has no xhigh key whatsoever. Do NOT hand-write full ladders
        # to "fix" maps that look sparse — sparse is the intended encoding.
        #
        # gpt-5.4-mini is the one real defect: models.dev gives it a genuine `max`
        # rung (low|medium|high|xhigh|max), but its shipped map is
        # `{xhigh: xhigh, minimal: low}` with no max key, so pi classifies max as
        # unsupported and clamps it DOWN to xhigh. The model's top rung is
        # therefore unreachable — the opposite of the clamp being harmless. Its
        # three siblings (gpt-5.3-codex-spark, gpt-5.4, gpt-5.5) really do stop at
        # xhigh per models.dev, so their identical-looking maps are correct and
        # deliberately left alone.
        gpt-5.4-mini:
          thinkingLevelMap: { max: max }
        gpt-5.6-terra: { contextWindow: 372000 }
    deepseek: # BUILT-IN provider — this entry ONLY supplies the API key + 1 patch.
      # DeepSeek's own platform (api.deepseek.com), the per-token FALLBACK to the
      # same models the opencode Go subscription above resells. Reach it as
      # `deepseek/deepseek-v4-flash`. VERIFIED WORKING with this key: a live
      # request returned `content` + `reasoning_content` and accepted
      # `reasoning_effort=max`.
      #
      # Pi's built-in registry NOW CARRIES V4 (pi-ai
      # dist/providers/data/deepseek.json: deepseek-v4-flash and deepseek-v4-pro,
      # both 1M/384K, both with thinkingLevelMap `max: max`), so the hand-pinned
      # model list this block used to carry is gone. That list was written when
      # the registry lacked V4 and it had drifted into a defect: its
      # thinkingLevelMap flattened every rung INCLUDING `max` to provider `high`,
      # on the stated grounds that "DeepSeek V4 currently exposes one reasoning
      # mode". V4 has a real low|high|max ladder — models.dev's
      # reasoning_options.effort, DeepSeek's own pi integration doc (which routes
      # xhigh -> max), and the built-in registry all say so — so a session pinned
      # to max was being sent at high, silently. Deleting the block fixes it at
      # the source and picks up the built-in's fuller compat as a bonus.
      # Re-pinning models here would also re-clobber that metadata: `models:`
      # entries upsert over the built-ins (provider-composer.js:101).
      gopass: pi/deepseek/api_key
      modelOverrides:
        # Same reserveTokens floor as the opencode-go copy above; kept aligned so
        # switching routes does not change the compaction maths.
        deepseek-v4-flash: { maxTokens: 128000 }
    kimi: # Kimi Code (Moonshot subscription) — OpenAI-compatible route
      # Pi DOES ship a built-in `kimi-coding` provider, but it is STALE and this
      # entry deliberately does not touch it: the built-in carries only k2p7 /
      # kimi-for-coding / kimi-k2-thinking, all at contextWindow 262144, and it
      # speaks the Anthropic protocol (api: anthropic-messages, baseUrl
      # https://api.kimi.com/coding). The current lineup is k3 / k3-256k /
      # kimi-for-coding / kimi-for-coding-highspeed. A separate provider name
      # keeps Pi's built-in metadata intact — per the warning above, reusing a
      # built-in model ID would overwrite its thinking levels and pricing.
      # OpenAI protocol chosen per user (2026-08-09) and corroborated live: the
      # Anthropic route (/coding/v1/messages) rejects this key with a hard
      # authentication_error, while the OpenAI route accepts it and fails only on
      # membership verification. Same provider name + base_url as the codex
      # `[model_providers.kimi]` block, so the two harnesses agree.
      # Docs: https://www.kimi.com/code/docs/en/kimi-code/models.html
      # Keys: www.kimi.com/code/console (max 5, each shown once at creation).
      base_url: https://api.kimi.com/coding/v1
      api: openai-completions
      # Was codex/kimi/private/api_key until 2026-08-17. The old per-harness
      # split (claude/* vs codex/*) is gone along with those gopass trees; keys
      # are now namespaced by SERVICE under pi/. This one is Kimi CODE — the
      # subscription behind https://api.kimi.com/coding/v1 — and is NOT the same
      # secret as the Moonshot platform key that aichat uses
      # (https://api.moonshot.ai/v1, now pi/moonshot/api_key). Two services, two
      # keys; do not collapse them.
      # A missing key is not fatal: private_models.json.tmpl silently SKIPS the
      # provider, so `chezmoi apply` still succeeds and kimi just does not appear
      # in `pi --list-models` until the secret exists.
      gopass: pi/kimi/api_key
      # Subscription/quota billing, not per-token, so cost is zeroed like Pi's
      # own kimi-coding entries — a running total here would be fiction.
      # Effort levels: K3 exposes low / high (its default) / max. K2.7 Code
      # exposes none, so those two models carry no thinkingLevelMap.
      models:
        - id: k3
          name: Kimi K3
          # 1M is an Allegretto-and-above benefit; Moderato caps K3 at 256K. Pi
          # derives its compaction trigger from contextWindow, so on a lower tier
          # this number is a wall waiting to be hit — use k3-256k there, or drop
          # this to 262144. Verify the tier before trusting 1M.
          contextWindow: 1000000
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
          thinkingLevelMap:
            {
              off: none,
              minimal: low,
              low: low,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
            }
        - id: k3-256k
          name: Kimi K3 (256K)
          # Same quality as k3 within 256K at roughly half the quota draw, and
          # unlike k3 its window does not depend on membership tier.
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
          thinkingLevelMap:
            {
              off: none,
              minimal: low,
              low: low,
              medium: high,
              high: high,
              xhigh: max,
              max: max,
            }
        - id: kimi-for-coding
          name: Kimi K2.7 Code
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false
        - id: kimi-for-coding-highspeed
          name: Kimi K2.7 Code HighSpeed
          # ~5-6x faster output at 3x quota draw; Allegretto and above only.
          contextWindow: 262144
          maxTokens: 32768
          reasoning: true
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false
    qwen: # Alibaba DashScope (OpenAI-compatible)
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: openai-completions
      env: DASHSCOPE_API_KEY
      # Keep limits explicit: string-only entries inherit Pi's generic 128K/16K
      # defaults, which are wrong for both hosted Qwen models.
      models:
        - id: qwen3-coder-plus
          contextWindow: 1000000
          maxTokens: 65536
        - id: qwen3-max
          contextWindow: 262144
          maxTokens: 65536
    doubao: # ByteDance Ark v3 (OpenAI-compatible)
      base_url: https://ark.cn-beijing.volces.com/api/v3
      api: openai-completions
      env: ARK_API_KEY
      models:
        - id: doubao-seed-1-6-thinking-250715
          contextWindow: 256000
          maxTokens: 16000
