# sing-box client on every machine (.chezmoitemplates/sing-box/{mode,config}.tmpl,
# docs/easytier.md). Exits come from .chezmoidata/easytier.yaml; secrets from
# gopass.
singBox:
  mixedPort: 7890 # SOCKS5 + HTTP on 127.0.0.1 (browser extension, proxy-on)
  clashApiPort: 9090 # web panel at http://127.0.0.1:9090/ui
  # metacubexd (Clash API web UI), fetched by sing-box on first start.
  webUiUrl: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
