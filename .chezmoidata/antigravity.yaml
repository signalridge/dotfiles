# Antigravity CLI (Google DeepMind) — managed slice of ~/.gemini/antigravity-cli/settings.json
#
# Binary: aqua `google-antigravity/antigravity-cli` (see .chezmoidata/versions.yaml).
# Rendered by dot_gemini/antigravity-cli/modify_private_settings.json.tmpl, which
# DEEP-MERGES these keys into the live file instead of replacing it. That matters:
# the CLI writes the same file at runtime (`/config`, `/permissions`, `/model`, and
# every "trust this folder" prompt appends to `trustedWorkspaces`), so a full-file
# template would silently revert the user's own choices on each `chezmoi apply` —
# the exact trap already hit with ~/.claude/settings.json. Only the keys listed
# here are owned; everything else in that file is left alone.
antigravity:
  settings:
    # Default model: managed so `chezmoi apply` moves existing machines off stale
    # stored aliases (e.g. "Gemini 3.7 Flash (High)"). Runtime `/model` switches
    # still work inside a session until the next `chezmoi apply`.
    #
    # Subagent tiers (dot_gemini/config/agents/) favor `flash` / `flash_lite`
    # for light work, `inherit` (matching this parent model) for standard work,
    # and reserve `pro` sparingly for genuinely hard tasks.
    model: "Gemini 4 Hydrogen (Medium)"

    # Tool approval policy. Four rungs, least to most permissive:
    #   strict              tightest
    #   request-review      approve every tool call individually (CLI default)
    #   proceed-in-sandbox  auto-approve commands INSIDE the sandbox; prompt only
    #                       when one tries to escape it. Needs a sandbox to mean
    #                       anything — pair it with enableTerminalSandbox: true,
    #                       or it grants the same reach as always-proceed.
    #   always-proceed      auto-approve everything ("YOLD")
    # YOLO baseline: auto-approve every tool call.
    toolPermission: always-proceed

    # YOLO baseline: allow the CLI to work across trusted repositories.
    allowNonWorkspaceAccess: true

    # YOLO baseline: do not add a terminal sandbox layer.
    enableTerminalSandbox: false

    # Deliberately NOT in `settings`, because the CLI owns them at runtime and
    # a managed value would fight the UI:
    #   trustedWorkspaces   appended by the "trust this folder" prompt
    #   permissions         the allow/deny rule table edited by /permissions
