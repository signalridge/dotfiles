homebrew:
  taps:
    shared:
      - nikitabobko/tap
    work: [] # azure/functions removed — repo GitHub-staff-disabled 2026-06-05 (untappable); func now installed from Azure CDN via run_onchange_after_12_azure-functions-core-tools
    private: []
  brews:
    shared:
      - macos-trash
      - mole
    work:
      - cliclick # macOS only - GUI automation
      - awscli
      - aws-sam-cli
      - azure-cli
      # azure-functions-core-tools@4 — installed from Azure CDN by run_onchange_after_12_azure-functions-core-tools (tap is GitHub-staff-disabled)
    private:
      - mas # Required for masApps installation
  casks:
    shared:
      - codex-app # OpenAI Codex desktop app for managing coding agents
      - displaylink # USB dock/adapter multi-monitor driver; needs reboot + manual Screen Recording grant
      - dockdoor
      - drawio # draw.io Desktop; provides the `drawio` CLI that backs the drawio-skill (diagram gen/export)
      - visual-studio-code
      - hammerspoon
      - karabiner-elements
      - keka
      - keyboardcleantool
      - vial
      # @nightly, not the plain `wezterm` cask: upstream's newest stable is
      # 20240203 (Feb 2024) with no release since, too old to trust on macOS 26.x.
      # Drop the `@nightly` suffix to pin stable.
      - wezterm@nightly
      - mockoon
      - notion
      - nikitabobko/tap/aerospace
      - obs
      - orbstack
      - pdf-expert
      - raycast # (HotKey: alt/option + space)search, caculate and run scripts(with many plugins)
      - rustdesk
      - slack
      - slidepilot
      - stats
      - tailscale-app
      - tolaria
      - typeless
      - google-chrome
    work:
      - dbeaver-community
      - gcloud-cli
      - keepingyouawake # menu-bar utility to keep the Mac awake
    private:
      - cherry-studio # Multi-model AI desktop client
      - adguard
      - balenaetcher
      - discord
      - iina # video player
      - logseq
      - motrix # download manager
      - notion-calendar
      - setapp
      - soundsource
      - surge
      - telegram
      - zoom
