claude:
  # Claude Code startup defaults -> env in dot_claude/modify_settings.json.tmpl
  # Docs: https://docs.anthropic.com/zh-CN/docs/claude-code/settings
  #
  # Native Anthropic OAuth only (the third-party provider/account layer was
  # removed; see git log -S'claude-manage'). Switch models at runtime with `/model`.

  # Opus 5.5 on the 1M-context beta (`[1m]` suffix); renders env.ANTHROPIC_MODEL.
  # Verify a new ID first with `claude -p --model '<id>'` against the live account.
  #
  # PRECEDENCE (measured, not assumed): a top-level `model` key in the live
  # ~/.claude/settings.json outranks ANTHROPIC_MODEL, and the modify_ script
  # PRESERVES that key rather than dropping it, so this file alone no longer
  # decides the running model. A stored alias is not self-updating either --
  # `model: "opus"` can resolve to an older version than ANTHROPIC_MODEL. Bumping
  # here means bumping that key too (`/model`, or edit settings.json).
  #
  # Opus 5.5's own effort default is `medium`, so keep the effortLevel seed in
  # modify_settings.json.tmpl -- do not drop it assuming the model defaults high.
  model: claude-opus-5-5[1m]
  # API_TIMEOUT_MS for every request.
  timeout_ms: 600000
