claude:
  # Claude Code Provider Configuration
  # Docs: https://docs.anthropic.com/zh-CN/docs/claude-code/settings
  #
  # Structure:
  #   - defaults: Global default settings (accounts can override)
  #   - providers: Provider definitions (base_url + available models)
  #   - accounts: Account configurations (model selection + settings)
  #
  # API keys stored in gopass: claude/providers/{provider}/accounts/{base64url(account)}/api_key

  # ===== Global Defaults =====
  # Fallback when neither account nor provider specifies a value.
  defaults:
    timeout_ms: 600000
    disable_nonessential_traffic: false
  # ===== Provider Definitions =====
  # Only base_url and available models list
  providers:
    # Native Anthropic (OAuth, no API key needed)
    anthropic:
      models:
        - claude-opus-4-8
        - claude-opus-4-7
        - claude-opus-4-7[1m]
        - claude-opus-4-6
        - claude-sonnet-4-6
        - claude-sonnet-4-5-20250929
        - claude-haiku-4-5-20251001
    # DeepSeek Claude Code: https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code
    deepseek:
      base_url: https://api.deepseek.com/anthropic
      timeout_ms: 300000
      disable_nonessential_traffic: true
      default_model: deepseek-v4-pro[1m]
      # User preference: run Claude Code subagents on pro instead of the documented flash default.
      subagent_model: deepseek-v4-pro[1m]
      models:
        - deepseek-v4-pro[1m]
        - deepseek-v4-flash
    # Kimi K2 (Moonshot): https://github.com/MoonshotAI/kimi-cli/blob/main/docs/en/configuration/providers.md
    kimi:
      base_url: https://api.kimi.com/coding
      timeout_ms: 300000
      disable_nonessential_traffic: true
      models:
        - kimi-k2.5
        - kimi-k2
    # GLM Coding Plan: https://docs.bigmodel.cn/cn/coding-plan/latest-model
    glm:
      base_url: https://api.z.ai/api/anthropic
      timeout_ms: 300000
      disable_nonessential_traffic: true
      default_model: glm-5.2
      subagent_model: glm-5.2
      models:
        - glm-5.2
        - glm-4.7
        - glm-4.5-air
    # Private GLM-compatible proxy.
    newapi:
      base_url: https://newapi.3689403.xyz/
      timeout_ms: 300000
      disable_nonessential_traffic: true
      default_model: glm-5.2
      subagent_model: glm-5.2
      models:
        - glm-5.2
        - glm-4.7
    # Qwen (Alibaba): https://help.aliyun.com/zh/model-studio/claude-code
    qwen:
      base_url: https://dashscope.aliyuncs.com/apps/anthropic
      timeout_ms: 300000
      disable_nonessential_traffic: true
      models:
        - qwen3-coder-plus
        - qwen3-max
        - qwen-flash
    # MiniMax: https://platform.minimax.io/docs/coding-plan/claude-code
    minimax:
      base_url: https://api.minimax.io/anthropic
      timeout_ms: 300000
      disable_nonessential_traffic: true
      models:
        - MiniMax-M2.1
    # Doubao (ByteDance): https://www.volcengine.com/docs/82379/1928261
    doubao:
      base_url: https://ark.cn-beijing.volces.com/api/coding
      timeout_ms: 300000
      disable_nonessential_traffic: true
      models:
        - ark-code-latest
    # Krill (gpt-5.5 served on an Anthropic-compatible endpoint): https://api.krill-ai.com
    krill:
      base_url: https://api.krill-ai.com/codex
      timeout_ms: 300000
      disable_nonessential_traffic: true
      # Drop the attribution header and experimental betas the proxy rejects,
      # and advertise gpt-5.5's reasoning/effort capabilities to Claude Code.
      attribution_header: "0"
      disable_experimental_betas: true
      supported_capabilities: thinking,adaptive_thinking,temperature,effort,max_effort
      subagent_model: gpt-5.5
      models:
        - gpt-5.5
  # ===== Account Configurations =====
  # Format: provider or provider@account
  # Fields: model, small_model, haiku_model, sonnet_model, opus_model, timeout_ms
  accounts:
    # Native Anthropic accounts (use OAuth)
    anthropic:
      model: claude-opus-4-8
    opus:
      provider: anthropic
      model: claude-opus-4-8
      small_model: claude-haiku-4-5-20251001
    haiku:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      small_model: claude-haiku-4-5-20251001
    # Third-party accounts (format: provider@label)
    # Add your own: deepseek@work, kimi@personal, etc.
    deepseek@private:
      provider: deepseek
      model: deepseek-v4-pro[1m]
      small_model: deepseek-v4-flash
      haiku_model: deepseek-v4-flash
      sonnet_model: deepseek-v4-pro[1m]
      opus_model: deepseek-v4-pro[1m]
      subagent_model: deepseek-v4-pro[1m]
    doubao@private:
      model: ark-code-latest
      small_model: ark-code-latest
      haiku_model: ark-code-latest
      sonnet_model: ark-code-latest
      opus_model: ark-code-latest
    kimi@private:
      model: kimi-k2.5
      small_model: kimi-k2.5
      haiku_model: kimi-k2.5
      sonnet_model: kimi-k2.5
      opus_model: kimi-k2.5
    newapi@private:
      provider: newapi
      model: glm-5.2
      small_model: glm-4.7
      haiku_model: glm-4.7
      sonnet_model: glm-5.2
      opus_model: glm-5.2
      subagent_model: glm-5.2
      auto_compact_window: 1000000
    # gpt-5.5 via krill; attribution/betas/capabilities inherit from the provider.
    krill@private:
      provider: krill
      model: gpt-5.5
      small_model: gpt-5.5
      haiku_model: gpt-5.5
      sonnet_model: gpt-5.5
      opus_model: gpt-5.5
      subagent_model: gpt-5.5
  # ==========================================================================
  # Claude Code Plugins (downloaded via .chezmoiexternal.toml.tmpl)
  # All skills are hardcoded in .chezmoiexternal.toml.tmpl
  # ==========================================================================
