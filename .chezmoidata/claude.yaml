claude:
  # Claude Code startup defaults -> env in dot_claude/modify_settings.json.tmpl
  # Docs: https://docs.anthropic.com/zh-CN/docs/claude-code/settings
  #
  # Native Anthropic OAuth only. The third-party provider/account layer
  # (deepseek/kimi/glm/qwen/minimax/doubao, claude-manage/claude-with/
  # claude-token) was removed on 2026-10-14: its gopass keys were already gone,
  # so none of those accounts could authenticate. Recover it from git history if
  # needed; switch Anthropic models at runtime with `/model`.

  # Opus 5.5 on the 1M-context beta (`[1m]` suffix). Bumped 5 -> 5.5 on
  # 2026-09-26, verified against the live account first: `claude -p --model
  # 'claude-opus-5-5[1m]'` returns provider firstParty, canonicalModel
  # claude-opus-5-5, contextWindow 1000000, maxOutputTokens 128000.
  # This renders env.ANTHROPIC_MODEL.
  #
  # PRECEDENCE (measured, not assumed): a top-level `model` key in the live
  # ~/.claude/settings.json outranks ANTHROPIC_MODEL, and the modify_ script
  # PRESERVES that key rather than dropping it, so this file alone no longer
  # decides the running model. A stored alias is not self-updating either --
  # `model: "opus"` still resolved to claude-opus-5[1m] with
  # ANTHROPIC_MODEL=claude-opus-5-5[1m] exported, because 5.5 is not yet the
  # tier default for the alias. Bumping here means bumping that key too
  # (`/model`, or edit settings.json) until the alias catches up.
  #
  # Opus 5.5's own effort default is `medium`, one rung below Opus 5's `high`,
  # so the effortLevel seed in modify_settings.json.tmpl carries more weight
  # now -- do not drop it assuming the model defaults high.
  model: claude-opus-5-5[1m]
  # API_TIMEOUT_MS for every request.
  timeout_ms: 600000
