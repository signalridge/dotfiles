# EasyTier mesh — nodes managed by this repo.
# Membership is by role, never by hostname (.chezmoitemplates/easytier/role.tmpl):
#   every Mac      -> client, virtual IP assigned by EasyTier DHCP (--dhcp)
#   Linux machine  -> exit, only when its own chezmoi config data sets
#                     `easytierExit = "<name in exits>"` (fixed IP below)
#   anything else  -> not a member, renders nothing.
# Both platforms run the official release
# binaries from /nix/store (nix-config/modules/easytier-package.nix.tmpl):
#   macOS: nix-config/modules/easytier.nix.tmpl (nix-darwin root LaunchDaemon)
#   Linux: systemd unit rendered and installed by the node script
#   both:  .chezmoiscripts/run_after_24_easytier-node.sh.tmpl (credentials from
#          gopass; sudo only when something changed)
#
# Credentials and the bastion address are NOT here: gopass easytier/network-name,
# easytier/network-secret and easytier/bastion-host (shared by all nodes, incl. the bastion relay and the
# NAS container, which are deployed outside this repo).
easytier:
  network: 10.144.144.0/24
  # Bastion (private-mode relay/discovery + STUN). This repo is public, so its
  # address is NOT here: gopass easytier/bastion-host, read at render time by
  # .chezmoitemplates/easytier/role.tmpl.
  bastion:
    peerPort: 11010 # tcp://<bastion-host>:11010
    stunPorts: [38478, 38479, 38480]
  # Members listen on UDP only. With a TCP listener, a peer that can reach it
  # (e.g. over public IPv6) connects over TCP first, and EasyTier never upgrades
  # an existing direct link, so path loss then throttles tunnelled TCP
  # (~20 vs 100 Mbit/s). For the same reason the node templates also pass
  # --disable-tcp-hole-punching (a punched TCP link won the race the same way).
  # TCP fallback remains through the bastion.
  listeners:
    - udp://0.0.0.0:11010
  # Exit nodes give other members internet egress through Shadowsocks 2022
  # (shadowsocks-rust ssserver; key in gopass easytier/exit-ss-password),
  # bound ONLY to the node's virtual IP, with an ACL that accepts only mesh
  # clients and refuses private/overlay destinations; clients pick one in
  # Surge / sing-box. Encrypted and authenticated even though the mesh already
  # is, since the exit hosts sit on shared campus LANs. Declared explicitly per
  # machine via its local `easytierExit` data, never inferred (e.g. from
  # headless): an exit relays other machines' traffic from its own IP. Linux
  # exits run it as the systemd --user unit ss-exit.service.
  exitProxy:
    port: 1080
    # shadowsocks-rust is the SS2022 reference implementation (TCP + UDP
    # interoperate with Surge and sing-box; gost's UDP did not).
    method: 2022-blake3-aes-256-gcm
  # Exit name -> fixed virtual IP. Clients (Surge, sing-box) point at these;
  # DHCP clients may take any other free address in the network.
  exits:
    gpuserver: 10.144.144.3 # easytierExit = "gpuserver" in gpuserver1's chezmoi.toml
    nas: 10.144.144.2 # Docker on the NAS, deployed outside this repo (docs/easytier.md)
