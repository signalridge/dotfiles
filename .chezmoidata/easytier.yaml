# EasyTier mesh — nodes managed by this repo.
# A machine joins only if its chezmoi `hostname` is a key of `nodes`; every
# other machine renders nothing. Both platforms run the official release
# binaries from /nix/store (nix-config/modules/easytier-package.nix.tmpl):
#   macOS: nix-config/modules/easytier.nix.tmpl (nix-darwin root LaunchDaemon)
#   Linux: systemd unit rendered and installed by the node script
#   both:  .chezmoiscripts/run_after_24_easytier-node.sh.tmpl (credentials from
#          gopass; sudo only when something changed)
#
# Credentials are NOT here: gopass easytier/network-name and
# easytier/network-secret (shared by all nodes, incl. the bastion relay and the
# NAS container, which are deployed outside this repo).
easytier:
  network: 10.144.144.0/24
  peers:
    - tcp://<bastion-ip>:11010 # bastion: private-mode relay/discovery node
  # Members listen on UDP only. With a TCP listener, a peer that can reach it
  # (e.g. over public IPv6) connects over TCP first, and EasyTier never upgrades
  # an existing direct link, so path loss then throttles tunnelled TCP
  # (~20 vs 100 Mbit/s). For the same reason the node templates also pass
  # --disable-tcp-hole-punching (a punched TCP link won the race the same way).
  # TCP fallback remains through the bastion.
  listeners:
    - udp://0.0.0.0:11010
  stunServers:
    - <bastion-ip>:38478
    - <bastion-ip>:38479
    - <bastion-ip>:38480
  # Exit nodes give other members internet egress through Shadowsocks
  # (gost; key in gopass easytier/exit-ss-password) bound ONLY to the node's
  # virtual IP with a mesh-only source whitelist; clients pick one in Surge /
  # sing-box. Encrypted and authenticated even though the mesh already is,
  # since the exit hosts sit on shared campus LANs. Declared explicitly per
  # node with `exitNode: true`, never inferred (e.g. from headless): an exit
  # relays other machines' traffic from its own IP. Linux nodes run it as the
  # systemd --user unit easytier-exit-proxy.service.
  exitProxy:
    port: 1080
    # Classic AEAD, not 2022-blake3-*: gost's UDP (ssu) handler fails SS2022 UDP
    # from Surge ("message authentication failed") while classic AEAD passes
    # TCP and UDP. Replay protection is moot inside the encrypted mesh.
    method: chacha20-ietf-poly1305
  # Exits deployed outside this repo (same port, see docs/easytier.md):
  externalExitNodes:
    nas: 10.144.144.2
  nodes:
    summit:
      ipv4: 10.144.144.1/24 # NAS is 10.144.144.2 (deployed outside this repo)
    gpuserver1:
      ipv4: 10.144.144.3/24
      exitNode: true
