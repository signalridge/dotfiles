# EasyTier mesh — macOS nodes managed by this repo.
# Consumed by nix-config/modules/easytier.nix.tmpl (root LaunchDaemon) and
# .chezmoiscripts/run_after_24_easytier-credentials.sh.tmpl (credentials).
# A Mac joins only if its chezmoi `hostname` is a key of `nodes`; every other
# machine renders an empty module and skips the credentials script.
#
# Credentials are NOT here: gopass easytier/network-name and
# easytier/network-secret (shared by all nodes, incl. the bastion relay and the
# NAS container, which are deployed outside this repo).
easytier:
  network: 10.144.144.0/24 # overlay route kept pinned to the EasyTier utun
  peers:
    - tcp://23.106.129.252:11010 # bastion: private-mode relay/discovery node
  stunServers:
    - 23.106.129.252:38478
    - 23.106.129.252:38479
    - 23.106.129.252:38480
  nodes:
    summit:
      ipv4: 10.144.144.1/24 # NAS is 10.144.144.2
