nix:
  sysPkgs: []
  homepkgs:
    shared:
      # texliveFull: temporarily disabled (90+ fmt derivations rebuild on every flake.lock update)
      # - "(texliveFull.withPackages (ps: with ps; [ ]))"
      - aria2
      - git
      - certbot
      - dasel
      - dust
      - ffmpeg
      - ghostscript # gs - PDF/PostScript processor (Snacks.image dependency)
      - hyperfine
      - lnav # aqua registry currently mismatches the macOS arm64 release asset
      - mermaid-cli # mmdc - Mermaid diagram renderer (render-markdown.nvim dependency)
      - mosh
      - imagemagick # magick/convert - image processing (Snacks.image dependency)
      - navi
      - ouch
      - pixi # fast Python/conda package manager
      # pre-commit: moved to pixi (avoids dotnet-sdk source compilation via nix)
      # Install: pixi global install pre-commit
      - prettier # JS/TS/JSON/YAML formatter
      - sheldon # shell plugin manager (prefer nix build over aqua binary on macOS)
      - openssh
      - openssl
      - poppler
      - sniffnet
      - statix # Nix linter
      - nixfmt
      - tlrc
      - tmux
      - wget
      - zstd
    work:
      - mariadb
      - postgresql
      - redis
    private: []
