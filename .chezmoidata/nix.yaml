nix:
  sysPkgs: []
  homepkgs:
    shared:
      # texlive: minimal set for Japanese lualatex (ltjsarticle, lang: ja) used by quarto.
      # NOTE: the nix store is read-only, so quarto/tlmgr CANNOT auto-install missing
      # packages at render time — everything the document needs must be listed here.
      # If a render reports a missing .sty/.cls, add the TeX Live package name below.
      # ~2.6 GiB on disk (vs scheme-full ~4.8 GiB) once latexextra/mathscience are included —
      # quarto's default PDF template genuinely needs that breadth. The combine derivations
      # build locally and rebuild on flake.lock bumps. Avoid texliveFull.withPackages (uncached).
      # collection-mathscience: unicode-math etc.; lualatex-math: separate pkg quarto needs under lualatex.
      # collection-latexextra: framed/fancyvrb/bookmark/footnotehyper/... quarto's default PDF template pulls these.
      # selnolig: standalone pkg quarto loads unconditionally under LuaTeX (not in the collections above).
      - |-
        (texlive.withPackages (
              ps: with ps; [
                scheme-basic
                latexmk
                collection-latexrecommended
                collection-latexextra
                collection-fontsrecommended
                collection-mathscience
                lualatex-math
                selnolig
                collection-langjapanese
              ]
            ))
      # age: chezmoi's encryption backend. MUST be managed here so the decryption
      # wrapper's fast path (~/.nix-profile/bin/age) is always satisfied and it never
      # falls through to `nix profile add` against this profile. flakey-profile installs
      # packages in a representation the modern `nix profile` command does not track, so
      # any bare `nix profile add` here rewrites the manifest from scratch and silently
      # drops every flakey-installed package (wget, git, ...). See age_command_wrapper.sh.
      - age
      - aria2
      - btop # Native Darwin build; upstream releases only ship Linux binaries.
      - git
      - certbot
      - dasel
      - ffmpeg
      - ghostscript # gs - PDF/PostScript processor (Snacks.image dependency)
      - lnav # aqua registry currently mismatches the macOS arm64 release asset
      - mermaid-cli # mmdc - Mermaid diagram renderer (render-markdown.nvim dependency)
      - mosh
      - imagemagick # magick/convert - image processing (Snacks.image dependency)
      - navi
      - pixi # fast Python/conda package manager
      - prettier # JS/TS/JSON/YAML formatter
      # nixpkgs' Cargo hook forbids bundled libgit2; sheldon needs the system library.
      - |-
        (sheldon.overrideAttrs (old: {
          buildInputs = (old.buildInputs or [ ]) ++ [ libgit2 ];
        }))
      - openssh
      - openssl
      - poppler
      - sniffnet
      - statix # Nix linter
      - nixfmt
      - wget
      - zstd
    work:
      - mariadb
      - postgresql
    private: []
