  - name: sigoden/aichat@v0.30.0
  - name: sharkdp/bat@v0.26.1
  - name: eth-p/bat-extras@v2024.08.24
    # aqua update can downgrade to v20200408 due semver ordering;
    # keep a known-good release pinned.
    update:
      enabled: false
