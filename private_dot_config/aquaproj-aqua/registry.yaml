---
# Local registry file for third-party aqua packages and targeted overrides.
# Referenced from aqua.yaml as `name: third-party, type: local, path: registry.yaml`.
# Each addition must also be allow-listed in aqua-policy.yaml.

packages:
  - type: github_release
    repo_owner: signalridge
    repo_name: slipway
    description: Spec-driven development with full lifecycle accountability for Claude, Codex & Cursor
    asset: "slipway_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: slipway
    overrides:
      - goos: windows
        asset: "slipway_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip"
        format: zip
    supported_envs:
      - darwin
      - linux
      - windows
  - type: github_release
    repo_owner: signalridge
    repo_name: qmk-hid-host
    description: Host component for communicating with QMK keyboards using Raw HID
    format: raw
    files:
      - name: qmk-hid-host
    # release assets are raw, per-platform binaries: qmk-hid-host-macos-arm64,
    # qmk-hid-host-linux-x86_64, qmk-hid-host-windows.exe
    asset: "qmk-hid-host-{{.OS}}-{{.Arch}}"
    replacements:
      darwin: macos
      amd64: x86_64
    overrides:
      - goos: windows
        asset: "qmk-hid-host-windows.exe"
    supported_envs:
      - darwin/arm64
      - linux/amd64
      - windows/amd64
  - type: github_release
    repo_owner: ogulcancelik
    repo_name: herdr
    description: Agent multiplexer that lives in your terminal
    format: raw
    files:
      - name: herdr
    # release assets are raw, per-platform binaries: herdr-macos-aarch64,
    # herdr-macos-x86_64, herdr-linux-aarch64, herdr-linux-x86_64 (no windows asset)
    asset: "herdr-{{.OS}}-{{.Arch}}"
    replacements:
      darwin: macos
      amd64: x86_64
      arm64: aarch64
    supported_envs:
      - darwin
      - linux
  - type: http
    repo_owner: MoonshotAI
    repo_name: kimi-code
    description: Kimi Code CLI — native single-binary AI coding agent (Kimi K3)
    # Binaries live on Moonshot's CDN, NOT GitHub Releases (whose assets are empty;
    # the repo only carries npm-style tags `@moonshot-ai/kimi-code@X`). version_prefix
    # strips that tag prefix into {{.SemVer}} ({{.Version}} keeps the full tag).
    # CDN layout: binaries/<semver>/kimi-code-<os>-<arch> — a raw, self-contained
    # Node-SEA binary (no Node runtime needed). Arch amd64->x64; darwin/linux only.
    version_prefix: "@moonshot-ai/kimi-code@"
    url: "https://code.kimi.com/kimi-code/binaries/{{.SemVer}}/kimi-code-{{.OS}}-{{.Arch}}"
    format: raw
    files:
      - name: kimi
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
  # ouch's releases carry Cosign bundles, but its standard-registry entry still
  # expects GitHub Artifact Attestations after the release workflow switched to
  # cosign. Keep verification enabled through the published bundle instead.
  - type: github_release
    repo_owner: ouch-org
    repo_name: ouch
    description: Painless compression and decompression in the terminal
    asset: "ouch-{{.Arch}}-{{.OS}}.{{.Format}}"
    format: tar.gz
    rosetta2: false
    windows_arm_emulation: true
    files:
      - name: ouch
        src: "{{.AssetWithoutExt}}/ouch"
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    overrides:
      - goos: windows
        format: zip
    cosign:
      bundle:
        type: github_release
        asset: "{{.Asset}}.sigstore.json"
      opts:
        - --certificate-identity-regexp
        - '^https://github\.com/ouch-org/ouch/\.github/workflows/draft-release-automatic-trigger\.yml@refs/tags/{{.Version}}-rc[0-9]+$'
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
  - type: github_release
    repo_owner: mr-karan
    repo_name: doggo
    description: ":dog: Command-line DNS Client for Humans. Written in Golang"
    asset: "doggo-{{.OS}}-{{.Arch}}.{{.Format}}"
    format: tar.gz
    files:
      - name: doggo
    replacements:
      amd64: x86_64
      arm64: aarch64
    checksum:
      type: github_release
      asset: "doggo_{{trimV .Version}}_checksums.txt"
      algorithm: sha256
    overrides:
      - goos: windows
        format: zip
        replacements: {}
    supported_envs:
      - darwin
      - linux
      - windows/amd64
