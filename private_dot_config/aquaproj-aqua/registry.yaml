---
# Local registry file for third-party aqua packages and targeted overrides.
# Referenced from aqua.yaml as `name: third-party, type: local, path: registry.yaml`.
# Each addition must also be allow-listed in aqua-policy.yaml.

packages:
  - type: github_release
    repo_owner: signalridge
    repo_name: slipway
    description: Spec-driven development with full lifecycle accountability for Claude, Codex & Cursor
    asset: "slipway_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: slipway
    overrides:
      - goos: windows
        asset: "slipway_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip"
        format: zip
    supported_envs:
      - darwin
      - linux
      - windows
  - type: github_release
    repo_owner: signalridge
    repo_name: qmk-hid-host
    description: Host component for communicating with QMK keyboards using Raw HID
    format: raw
    files:
      - name: qmk-hid-host
    # release assets are raw, per-platform binaries: qmk-hid-host-macos-arm64,
    # qmk-hid-host-linux-x86_64, qmk-hid-host-windows.exe
    asset: "qmk-hid-host-{{.OS}}-{{.Arch}}"
    replacements:
      darwin: macos
      amd64: x86_64
    overrides:
      - goos: windows
        asset: "qmk-hid-host-windows.exe"
    supported_envs:
      - darwin/arm64
      - linux/amd64
      - windows/amd64
  - type: github_release
    repo_owner: ogulcancelik
    repo_name: herdr
    description: Agent multiplexer that lives in your terminal
    format: raw
    files:
      - name: herdr
    # release assets are raw, per-platform binaries: herdr-macos-aarch64,
    # herdr-macos-x86_64, herdr-linux-aarch64, herdr-linux-x86_64 (no windows asset)
    asset: "herdr-{{.OS}}-{{.Arch}}"
    replacements:
      darwin: macos
      amd64: x86_64
      arm64: aarch64
    supported_envs:
      - darwin
      - linux
  - type: github_release
    repo_owner: router-for-me
    repo_name: CLIProxyAPI
    description: Local OAuth gateway for Claude Code
    asset: "CLIProxyAPI_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: cliproxyapi
        src: cli-proxy-api
    replacements:
      arm64: aarch64
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin/arm64
      - darwin/amd64
      - linux/arm64
      - linux/amd64
  - type: http
    repo_owner: MoonshotAI
    repo_name: kimi-code
    description: Kimi Code CLI — native single-binary AI coding agent (Kimi K3)
    # Binaries live on Moonshot's CDN, NOT GitHub Releases (whose assets are empty;
    # the repo only carries npm-style tags `@moonshot-ai/kimi-code@X`). version_prefix
    # strips that tag prefix into {{.SemVer}} ({{.Version}} keeps the full tag).
    # CDN layout: binaries/<semver>/kimi-code-<os>-<arch> — a raw, self-contained
    # Node-SEA binary (no Node runtime needed). Arch amd64->x64; darwin/linux only.
    version_prefix: "@moonshot-ai/kimi-code@"
    url: "https://code.kimi.com/kimi-code/binaries/{{.SemVer}}/kimi-code-{{.OS}}-{{.Arch}}"
    format: raw
    files:
      - name: kimi
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
  # ouch's releases carry Cosign bundles, but its standard-registry entry still
  # expects GitHub Artifact Attestations after the release workflow switched to
  # cosign. Keep verification enabled through the published bundle instead.
  - type: github_release
    repo_owner: ouch-org
    repo_name: ouch
    description: Painless compression and decompression in the terminal
    asset: "ouch-{{.Arch}}-{{.OS}}.{{.Format}}"
    format: tar.gz
    rosetta2: false
    windows_arm_emulation: true
    files:
      - name: ouch
        src: "{{.AssetWithoutExt}}/ouch"
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    overrides:
      - goos: windows
        format: zip
    cosign:
      bundle:
        type: github_release
        asset: "{{.Asset}}.sigstore.json"
      opts:
        - --certificate-identity-regexp
        - '^https://github\.com/ouch-org/ouch/\.github/workflows/draft-release-automatic-trigger\.yml@refs/tags/{{.Version}}-rc[0-9]+$'
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
  - type: github_release
    repo_owner: mr-karan
    repo_name: doggo
    description: ":dog: Command-line DNS Client for Humans. Written in Golang"
    asset: "doggo-{{.OS}}-{{.Arch}}.{{.Format}}"
    format: tar.gz
    files:
      - name: doggo
    replacements:
      amd64: x86_64
      arm64: aarch64
    checksum:
      type: github_release
      asset: "doggo_{{trimV .Version}}_checksums.txt"
      algorithm: sha256
    overrides:
      - goos: windows
        format: zip
        replacements: {}
    supported_envs:
      - darwin
      - linux
      - windows/amd64
  # Same as the standard crates.io/eza entry, plus --locked: without the crate's
  # Cargo.lock, cargo pairs eza 0.23.5's palette 0.7.5 with palette_derive
  # 0.7.7, whose derives reference modules palette 0.7.5 lacks, so fresh builds
  # fail ("could not find `lms` in the crate root").
  - name: crates.io/eza
    type: cargo
    repo_owner: eza-community
    repo_name: eza
    description: A modern replacement for ls
    crate: eza
    cargo:
      locked: true
  # Fastfetch 2.70.0 switched macOS back to a universal archive. The standard
  # registry still requests fastfetch-macos-aarch64.tar.gz on Apple Silicon.
  - type: github_release
    repo_owner: fastfetch-cli
    repo_name: fastfetch
    description: An actively maintained, feature-rich and performance oriented, neofetch like system information tool
    version_constraint: semver(">= 2.70.0")
    asset: "fastfetch-{{.OS}}-{{.Arch}}.{{.Format}}"
    format: tar.gz
    files:
      - name: fastfetch
        src: "{{.AssetWithoutExt}}/usr/bin/fastfetch"
    replacements:
      arm64: aarch64
      darwin: macos
    overrides:
      - goos: darwin
        asset: "fastfetch-macos-universal.{{.Format}}"
      - goos: windows
        format: zip
        files:
          - name: fastfetch
  # Not in the standard registry. Every release asset ships a sibling
  # `<asset>.sha256`; Linux uses the static musl build (no glibc coupling).
  - type: github_release
    repo_owner: shadowsocks
    repo_name: shadowsocks-rust
    description: Shadowsocks reference implementation in Rust (ssserver, sslocal, ssurl, ssmanager, ssservice)
    asset: "shadowsocks-{{.Version}}.{{.Arch}}-{{.OS}}.tar.xz"
    format: tar.xz
    files:
      - name: ssserver
      - name: sslocal
      - name: ssurl
      - name: ssmanager
      - name: ssservice
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    supported_envs:
      - darwin
      - linux/amd64
      - linux/arm64
  # Not in the standard registry, and releases ship no checksum file, so the
  # pin in aqua-private.yaml is the only control. Archives hold a bare `realm`;
  # Linux uses the static musl build.
  - type: github_release
    repo_owner: zhboner
    repo_name: realm
    description: Fast TCP/UDP port relay
    asset: "realm-{{.Arch}}-{{.OS}}.tar.gz"
    format: tar.gz
    files:
      - name: realm
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
    supported_envs:
      - darwin
      - linux/amd64
      - linux/arm64
  # Not in the standard registry. Releases ship no checksum file (only the
  # GitHub asset digests, which aqua cannot consume), so there is no checksum
  # block; the pin in aqua.yaml is the only control.
  - type: github_release
    repo_owner: SagerNet
    repo_name: sing-box
    description: Universal proxy platform (SOCKS/HTTP/mixed inbounds, TCP/UDP forwarding, chains, Clash API)
    asset: "sing-box-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: sing-box
        src: "sing-box-{{trimV .Version}}-{{.OS}}-{{.Arch}}/sing-box"
    supported_envs:
      - linux/amd64
      - linux/arm64
  - type: github_release
    repo_owner: apernet
    repo_name: hysteria
    description: Censorship-resistant QUIC proxy (client and server in one binary)
    # Tags are monorepo-style `app/vX.Y.Z`; version_prefix strips `app/` so the
    # aqua.yaml pin reads app/vX.Y.Z while {{.SemVer}} stays X.Y.Z.
    version_prefix: app/
    # Release assets are raw, per-platform binaries: hysteria-darwin-arm64,
    # hysteria-linux-amd64, ... (no version in the name).
    asset: "hysteria-{{.OS}}-{{.Arch}}"
    format: raw
    files:
      - name: hysteria
    # hashes.txt lists every asset as `<sha256>  build/<asset>`, so the default
    # parser cannot match the bare asset name.
    checksum:
      type: github_release
      asset: hashes.txt
      algorithm: sha256
      file_format: regexp
      pattern:
        checksum: '^([a-f0-9]{64})\s'
        file: '^[a-f0-9]{64}\s+build/(\S+)$'
    supported_envs:
      - darwin
      - linux/amd64
      - linux/arm64
