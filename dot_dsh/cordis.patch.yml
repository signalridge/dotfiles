# Home-level defaults apply to every profile, after Web UI settings.
# OAuth remains owned/refreshed by CLIProxyAPI; only its local client key is
# supplied by dsh-with. No credentials or OAuth grants live in this file.
- id: llm-pi-ai
  config:
    providers:
      cliproxy:
        displayName: OpenAI (OAuth via CLIProxyAPI)
        apiKeyEnv: CLIPROXY_API_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:8317/v1
        reasoning: high
        compat:
          supportsMaxOutputTokens: false
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            # CPA Responses accepted 921,361 input tokens; ~922K was rejected
            # (2026-10-11). The public API's total window is not input capacity.
            contextWindow: 921000
            # max_output_tokens is not sent on this OAuth-backed route. Match
            # native output metadata so dsh reserves 128K, not a fictional 32K.
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
# Shared default for NEW Web and headless sessions. Old sessions keep their
# logged model; create a new session after switching this default.
- id: agent-default-model
  config:
    provider: cliproxy
    model: gpt-6.1-sol
    reasoningEffort: high
# These controls stop additional log/feedback uploads, not model API requests.
- id: session-log-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  config:
    mode: DISABLED
